<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팬 챗 프로토타입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { --bg: #0b0b10; --panel: #15151d; --line: #262633; --text: #f4f4f6; --sub: #9a9aab; --brand: #8956fb; --mine: #2a2140; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--text); letter-spacing: -0.01em; }
    button, textarea { font: inherit; color: inherit; }
    #view { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 8px 16px; background: #1b1b24; font-size: 13px; border-bottom: 1px dashed #444; }
    #view select { background: #0b0b10; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
    #app { max-width: 480px; margin: 0 auto; min-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--panel); }
    @media (min-width: 1024px) { #app { max-width: 720px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3a3a4a; flex: none; }
    .avatar.sm { width: 28px; height: 28px; }
    .name { font-weight: 700; }
    .sub { color: var(--sub); font-size: 13px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; padding: 12px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--sub); cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--brand); font-weight: 700; }
    .feed { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row.me { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; background: #23232e; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .me .bubble { background: var(--mine); }
    .meta { font-size: 11px; color: var(--sub); margin-top: 4px; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: #2d2d3a; color: var(--sub); margin-left: 4px; }
    .tag.brand { background: rgba(137, 86, 251, 0.18); color: #c9b3ff; }
    .ph { display: inline-block; padding: 0 6px; border-radius: 6px; background: rgba(137, 86, 251, 0.25); color: #d8c8ff; }
    .composer { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .composer .line { display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: #0f0f15; }
    .btn { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--brand); font-weight: 700; cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.ghost { background: #23232e; font-weight: 500; }
    .btn.sm { min-height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; }
    .hint { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; gap: 8px; }
    .over { color: #ff7a7a; }
    .card { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .quote { font-size: 12px; color: var(--sub); border-left: 2px solid var(--line); padding-left: 8px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 24px; text-align: center; }
    .empty { color: var(--sub); text-align: center; padding: 32px 0; }
    .notice { margin: 0 16px; padding: 10px 12px; border-radius: 12px; background: #1f1f2a; font-size: 13px; color: var(--sub); }
  </style>
</head>
<body>
  <!-- 보기 전환 — SPEC.md 권한 표·상태 변화 표를 눈으로 대조하는 장치. 프로토타입 화면의 일부가 아니다. -->
  <div id="view">
    <label>역할 <select id="role"></select></label>
    <label>상태 <select id="state"></select></label>
    <label>멤버십 가입 <select id="days"></select></label>
  </div>

  <div id="app"></div>

  <script>
    // 숫자는 여기 한 곳 — SPEC.md 「숫자」 절과 같은 값.
    const NUM = {
      // 팬 답장 글자 수 상한 — 멤버십 가입 일수가 길수록 늘어난다. [가입 n일 이상, 상한]
      replyLimit: [[0, 30], [30, 60], [100, 100], [365, 150]],
      ownerMessageLimit: 1000,
      crewSize: 128,
    };
    const NICK_TOKEN = "{닉네임}";
    const ROLES = { guest: "비로그인", outsider: "멤버 아님", fan: "멤버 팬", owner: "방송인" };
    const STATES = { active: "대화 중", empty: "첫 메시지 전", blocked: "이 팬 답장 제한" };
    const DAYS = { 3: "3일째", 45: "45일째", 120: "120일째", 400: "400일째" };

    const view = { role: "fan", state: "active", days: 45, tab: "send", replyTo: null };
    const ME = "별사탕";
    const OWNER = "달빛하루";

    // 가짜 데이터 — 실데이터 금지.
    const seed = () => ({
      ownerMsgs: [
        { id: 1, at: "어제 22:10", text: `${NICK_TOKEN}, 오늘 방송 와 줘서 고마워!` },
        { id: 2, at: "어제 22:12", text: "다음 주 노래 방송 곡 추천 받아요 🎤" },
        { id: 3, at: "오늘 09:03", text: `좋은 아침 ${NICK_TOKEN}~ 오늘도 화이팅` },
      ],
      replies: [
        { id: 11, to: 2, fan: "별사탕", days: 45, at: "어제 22:20", text: "봄날 불러 주세요!!", heart: false, dm: null },
        { id: 12, to: 2, fan: "고양이발", days: 400, at: "어제 22:31", text: "저번에 부른 그 발라드 한 번 더요. 진짜 좋았어요 매일 듣는 중", heart: true, dm: null },
        { id: 13, to: 3, fan: "새벽두시", days: 3, at: "오늘 09:10", text: "좋은 아침이에요", heart: false, dm: "새벽두시도 좋은 아침!" },
        { id: 14, to: 3, fan: "별사탕", days: 45, at: "오늘 09:15", text: "출근길에 보고 힘 났어요", heart: true, dm: "출근 잘 해 ☺️" },
      ],
    });
    let data = seed();

    const limitFor = (days) => NUM.replyLimit.filter(([d]) => days >= d).at(-1)[1];
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const forFan = (text) => esc(text).replaceAll(NICK_TOKEN, esc(ME));
    const forOwner = (text) => esc(text).replaceAll(NICK_TOKEN, `<span class="ph">${NICK_TOKEN}</span>`);
    const app = document.getElementById("app");

    const header = (sub) => `
      <header>
        <div class="avatar"></div>
        <div><div class="name">${OWNER} <span class="tag brand">팬 챗</span></div><div class="sub">${sub}</div></div>
      </header>`;

    const gate = (title, desc, cta) => `${header("멤버십 전용 팬 챗")}
      <div class="center"><div class="name">${title}</div><div class="sub">${desc}</div><button class="btn">${cta}</button></div>`;

    const composer = ({ id, placeholder, limit, extra = "", disabled = false, note = "" }) => `
      <div class="composer">
        ${note ? `<div class="hint">${note}</div>` : ""}
        <div class="line">
          <textarea id="${id}" rows="1" placeholder="${placeholder}" ${disabled ? "disabled" : ""}></textarea>
          <button class="btn" data-send="${id}" disabled>보내기</button>
        </div>
        <div class="hint"><span>${extra}</span><span data-count="${id}">0 / ${limit}</span></div>
      </div>`;

    const fanRoom = () => {
      const limit = limitFor(view.days);
      const items = view.state === "empty" ? [] : [
        ...data.ownerMsgs.map((m) => ({ kind: "owner", at: m.at, id: m.id, m })),
        ...data.replies.filter((r) => r.fan === ME).flatMap((r) => [
          { kind: "mine", at: r.at, id: r.to + 0.5, r },
          ...(r.dm ? [{ kind: "dm", at: r.at, id: r.to + 0.6, r }] : []),
        ]),
      ].sort((a, b) => a.id - b.id);
      const blocked = view.state === "blocked";
      return `${header(`멤버 ${view.days}일째 · 답장 ${limit}자까지`)}
        <div class="notice">${OWNER}님 메시지는 멤버 전원이 받고, 내 답장은 ${OWNER}님만 봐요.</div>
        <div class="feed">
          ${items.length === 0 ? `<div class="empty">아직 ${OWNER}님이 보낸 메시지가 없어요.<br>첫 메시지가 오면 알려 드릴게요.</div>` : ""}
          ${items.map((it) =>
            it.kind === "owner" ? `<div class="row"><div class="avatar sm"></div><div><div class="bubble">${forFan(it.m.text)}</div><div class="meta">${it.at}</div></div></div>`
            : it.kind === "mine" ? `<div class="row me"><div><div class="bubble">${esc(it.r.text)}</div><div class="meta">${it.at} · ${OWNER}님만 볼 수 있어요${it.r.heart ? ` <span class="tag brand">♥ ${OWNER}</span>` : ""}</div></div></div>`
            : `<div class="row"><div class="avatar sm"></div><div><div class="bubble">${esc(it.r.dm)}</div><div class="meta"><span class="tag brand">나에게만 온 답장</span></div></div></div>`
          ).join("")}
        </div>
        ${composer({
          id: "fan-reply", limit, disabled: blocked || view.state === "empty",
          placeholder: blocked ? "이 방에서 답장이 제한됐어요" : view.state === "empty" ? "첫 메시지가 오면 답장할 수 있어요" : `${OWNER}님에게 답장`,
          extra: blocked ? "제한에 대해 문의하기" : "멤버십 기간이 길수록 더 길게 쓸 수 있어요",
        })}`;
    };

    const ownerSend = () => `
      <div class="feed">
        ${view.state === "empty" ? `<div class="empty">멤버 ${NUM.crewSize}명이 첫 메시지를 기다리고 있어요.</div>` : ""}
        ${(view.state === "empty" ? [] : data.ownerMsgs).map((m) => {
          const n = data.replies.filter((r) => r.to === m.id).length;
          return `<div class="row me"><div><div class="bubble">${forOwner(m.text)}</div><div class="meta">${m.at} · 답장 ${n}</div></div></div>`;
        }).join("")}
      </div>
      ${composer({
        id: "owner-msg", limit: NUM.ownerMessageLimit, placeholder: "멤버 전원에게 보내기",
        note: `<span>받는 사람: 멤버 ${NUM.crewSize}명</span><button class="btn ghost sm" data-insert>${NICK_TOKEN} 넣기</button>`,
        extra: `${NICK_TOKEN}는 받는 팬의 닉네임으로 바뀌어요`,
      })}`;

    const ownerInbox = () => {
      const list = view.state === "empty" ? [] : [...data.replies].reverse();
      return `<div class="feed">
        ${list.length === 0 ? `<div class="empty">아직 받은 답장이 없어요.</div>` : ""}
        ${list.map((r) => {
          const q = data.ownerMsgs.find((m) => m.id === r.to);
          return `<div class="card">
            <div class="row"><div class="avatar sm"></div><div><span class="name">${esc(r.fan)}</span><span class="tag">멤버 ${r.days}일째</span><div class="meta">${r.at}</div></div></div>
            <div class="quote">${forOwner(q.text)}</div>
            <div>${esc(r.text)}</div>
            ${r.dm ? `<div class="sub">↳ 나의 답장: ${esc(r.dm)} <span class="tag">${esc(r.fan)}님만</span></div>` : ""}
            ${view.replyTo === r.id ? composer({ id: `dm-${r.id}`, limit: NUM.ownerMessageLimit, placeholder: `${r.fan}님에게만 답장` }) : ""}
            <div class="actions">
              <button class="btn ghost sm" data-heart="${r.id}">${r.heart ? "♥ 보냄" : "♡ 하트"}</button>
              ${r.dm ? "" : `<button class="btn ghost sm" data-dm="${r.id}">이 팬에게만 답장</button>`}
              <button class="btn ghost sm">답장 제한</button>
            </div>
          </div>`;
        }).join("")}
      </div>`;
    };

    const ownerRoom = () => `${header(`멤버 ${NUM.crewSize}명 · 내 팬 챗`)}
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="${view.tab === "send"}" data-tab="send">보낸 메시지</button>
        <button role="tab" aria-selected="${view.tab === "inbox"}" data-tab="inbox">받은 답장 ${view.state === "empty" ? "" : data.replies.length}</button>
      </div>
      ${view.tab === "send" ? ownerSend() : ownerInbox()}`;

    const SCREENS = {
      guest: () => gate("로그인이 필요해요", `${OWNER}님 멤버만 들어올 수 있는 팬 챗이에요.`, "로그인"),
      outsider: () => gate("멤버십 전용 팬 챗이에요", `멤버십에 가입하면 ${OWNER}님 메시지를 받을 수 있어요.`, "멤버십 가입"),
      fan: fanRoom,
      owner: ownerRoom,
    };

    const render = () => { app.innerHTML = SCREENS[view.role](); };

    app.addEventListener("input", (e) => {
      const t = e.target;
      if (t.tagName !== "TEXTAREA") return;
      const limit = Number(app.querySelector(`[data-count="${t.id}"]`).textContent.split("/ ")[1]);
      const n = [...t.value].length;
      const count = app.querySelector(`[data-count="${t.id}"]`);
      count.textContent = `${n} / ${limit}`;
      count.classList.toggle("over", n > limit);
      app.querySelector(`[data-send="${t.id}"]`).disabled = n === 0 || n > limit;
    });

    app.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const d = b.dataset;
      if (d.tab) { view.tab = d.tab; view.replyTo = null; }
      if (d.heart) { const r = data.replies.find((x) => x.id === Number(d.heart)); r.heart = !r.heart; }
      if (d.dm) view.replyTo = Number(d.dm);
      if ("insert" in d) { const t = document.getElementById("owner-msg"); t.value += NICK_TOKEN; t.dispatchEvent(new Event("input", { bubbles: true })); t.focus(); return; }
      if (d.send) {
        const text = document.getElementById(d.send).value.trim();
        if (d.send === "fan-reply") data.replies.push({ id: Date.now(), to: data.ownerMsgs.at(-1).id, fan: ME, days: view.days, at: "방금", text, heart: false, dm: null });
        if (d.send === "owner-msg") data.ownerMsgs.push({ id: data.ownerMsgs.at(-1).id + 10, at: "방금", text });
        if (d.send.startsWith("dm-")) { data.replies.find((x) => x.id === view.replyTo).dm = text; view.replyTo = null; }
      }
      render();
    });

    const fill = (el, opts, cur) => {
      el.innerHTML = Object.entries(opts).map(([v, t]) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${t}</option>`).join("");
    };
    fill(role, ROLES, view.role);
    fill(state, STATES, view.state);
    fill(days, DAYS, view.days);
    role.onchange = () => { view.role = role.value; view.tab = "send"; render(); };
    state.onchange = () => { view.state = state.value; data = seed(); render(); };
    days.onchange = () => { view.days = Number(days.value); render(); };
    render();
  </script>
</body>
</html>
