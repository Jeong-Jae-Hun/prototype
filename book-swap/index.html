<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중고책 교환</title>
  <!-- 순서가 중요하다: 테마(색 결정) → 토큰·컴포넌트 → 셸 -->
  <script src="../design-system/theme.js" data-brands="reader"></script>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <script src="../app-structure/shell.js" data-active="book-swap" defer></script>
  <style>
    main { max-width: 960px; margin: 0 auto; padding: var(--ds-space-5) var(--ds-space-4); display: flex; flex-direction: column; gap: var(--ds-space-4); }
    [hidden] { display: none !important; }
    h1 { font-size: var(--ds-font-size-xl); margin: 0; }
    h2 { font-size: var(--ds-font-size-lg); margin: 0 0 var(--ds-space-3); }
    h3 { font-size: var(--ds-font-size-md); margin: 0; }
    p { margin: 0; }
    .sub { color: var(--ds-color-sub); font-size: var(--ds-font-size-sm); }
    .stack { display: flex; flex-direction: column; gap: var(--ds-space-3); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ds-space-2); }
    .actions { display: flex; flex-wrap: wrap; gap: var(--ds-space-2); }
    .actions > .ds-btn { flex: 1 1 160px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--ds-space-3); }
    .book { display: flex; gap: var(--ds-space-3); }
    .book .ph { width: 72px; flex: none; }
    .grid .book { flex-direction: column; }
    .grid .book .ph { width: 100%; }
    .ph { aspect-ratio: 3 / 4; border-radius: var(--ds-radius-sm); background: var(--ds-color-placeholder); }
    .photos { display: flex; gap: var(--ds-space-2); }
    .photos .ph { width: 64px; }
    .photos .ph--add { display: flex; align-items: center; justify-content: center; color: var(--ds-color-sub); border: 1px dashed var(--ds-color-line); background: transparent; cursor: pointer; font-size: var(--ds-font-size-lg); }
    .code { font-size: 28px; font-weight: 800; letter-spacing: 0.2em; color: var(--ds-color-brand-text); }
    .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--ds-space-2); }
    .steps li { display: flex; gap: var(--ds-space-2); color: var(--ds-color-sub); }
    .steps li[data-done="1"] { color: var(--ds-color-text); }
    .steps li[data-now="1"] { color: var(--ds-color-brand-text); font-weight: 700; }
    .two { display: grid; gap: var(--ds-space-3); }
    @media (min-width: 720px) { .two { grid-template-columns: 1fr 1fr; } }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--ds-space-2); }
    legend { font-weight: 600; margin-bottom: var(--ds-space-2); }
    .choice { display: flex; gap: var(--ds-space-2); align-items: flex-start; padding: var(--ds-space-3); border: 1px solid var(--ds-color-line); border-radius: var(--ds-radius-md); cursor: pointer; min-height: var(--ds-tap); }
    .choice:has(input:checked) { border-color: var(--ds-color-brand); background: var(--ds-color-brand-soft); }
    .toast { position: sticky; bottom: calc(var(--ds-shell-bottom) + var(--ds-space-2)); }
    textarea.ds-input { min-height: 88px; }
  </style>
</head>
<body>
  <div id="view">
    <a href="../">← 목록</a>
    <a href="../spec.html?slug=book-swap">명세 읽기</a>
    <label>역할 <select id="role"></select></label>
    <label>상태 <select id="state"></select></label>
  </div>

  <main id="app"></main>

  <script>
    // 숫자는 여기 한 곳 — SPEC.md 「숫자」 절과 같은 값.
    const NUM = {
      REQUEST_REPLY_DAYS: 3,   // 요청에 응답할 기한
      DROP_DAYS: 3,            // 교환 확정 뒤 서점에 맡길 기한
      HOLD_DAYS: 7,            // 둘 다 맡긴 뒤 픽업 기한
      RETURN_DAYS: 7,          // 만료 시 이미 맡긴 책을 되찾아 갈 기한
      DISPUTE_HOURS: 24,       // 픽업 뒤 상태 등급 이의 기한
      MAX_LISTINGS: 10,        // 한 사람이 동시에 올려 둘 수 있는 책
      MAX_OUT_REQUESTS: 3,     // 한 사람이 동시에 보내 둘 수 있는 요청
      PHOTO_MAX: 3,
      NOSHOW_LIMIT: 2,         // 이 횟수만큼 노쇼하면
      NOSHOW_WINDOW_DAYS: 90,  // (이 기간 안에서 센다)
      SUSPEND_DAYS: 30,        // 이만큼 교환 요청·수락이 막힌다
    };

    const ROLES = { guest: "비로그인", lister: "독자(등록자)", requester: "독자(요청자)", admin: "운영자" };
    const STATES = { listed: "등록됨", requested: "요청 받음", confirmed: "교환 확정(맡기기 대기)", held: "서점 보관 중", done: "완료", closed: "만료·취소" };

    // ─── 가짜 데이터 ───
    const DISTRICTS = ["숲내구", "강변구", "언덕구"];
    const STORES = { 숲내구: ["골목서점", "숲속책방"], 강변구: ["물결책방"], 언덕구: ["언덕책집"] };
    const GRADES = {
      A: "거의 새 책 — 밑줄·접힘 없음",
      B: "사용감 있음 — 밑줄·메모 조금, 낙장 없음",
      C: "많이 읽힘 — 변색·메모 많음, 낙장 없음",
    };
    const CATALOG = { "9788900000001": "바람의 서랍", "9788900000002": "느린 우체국의 여름", "9788900000003": "작은 정원 일기" };
    const BOOK_X = { title: "바람의 서랍", grade: "B", district: "숲내구", store: "골목서점", nick: "책벌레담" };
    const OFFERS = [
      { id: "o1", title: "느린 우체국의 여름", grade: "A", nick: "밤산책" },
      { id: "o2", title: "고양이 문법", grade: "C", nick: "소나기" },
    ];
    const OTHERS = [
      { title: "작은 정원 일기", grade: "C", district: "강변구", store: "물결책방" },
      { title: "고양이 문법", grade: "A", district: "숲내구", store: "숲속책방" },
      { title: "겨울 철새 도감", grade: "B", district: "언덕구", store: "언덕책집" },
    ];
    const MY_BOOKS = [{ id: "o1", title: "느린 우체국의 여름", grade: "A" }, { id: "m2", title: "밤의 레시피", grade: "B" }];
    const CODES = { drop: { lister: "K7Q2", requester: "M3X8" }, pick: { lister: "P4N6", requester: "T9B1" } };

    // ─── 메모리 상태 ───
    const view = { role: "lister", state: "listed" };
    const ui = {
      district: "숲내구", offer: "o1", isbn: "", isbnResult: null, grade: "", photos: 0,
      regDistrict: "숲내구", myListings: [{ ...BOOK_X }],
      drop: { lister: false, requester: false }, pick: { lister: false, requester: false },
      closedReason: "drop", cancelReason: "", toast: "", reporting: false, requesting: false,
    };

    const fill = (el, opts, cur) => {
      el.innerHTML = Object.entries(opts).map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join("");
    };
    const syncFlags = () => {
      const s = view.state;
      const dropped = s === "held" || s === "done";
      ui.drop = { lister: dropped, requester: dropped };
      ui.pick = { lister: s === "done", requester: s === "done" };
      if (s === "closed") ui.drop = { lister: true, requester: false };
    };
    const go = (state, toast = "") => { view.state = state; stateSel.value = state; syncFlags(); ui.toast = toast; render(); };

    // ─── 조각 ───
    const tag = (t, kind = "") => `<span class="ds-tag${kind ? ` ds-tag--${kind}` : ""}">${t}</span>`;
    const gradeTag = (g) => tag(`상태 ${g}`, "brand");
    const bookCard = (b, extra = "") => `
      <article class="ds-card book">
        <div class="ph" role="img" aria-label="책 사진 자리"></div>
        <div class="stack">
          <h3>${b.title}</h3>
          <div class="row">${gradeTag(b.grade)}${b.district ? tag(b.district) : ""}${b.store ? tag(`맡김 ${b.store}`) : ""}</div>
          ${extra}
        </div>
      </article>`;
    const free = `<p class="ds-notice">돈·포인트가 오가지 않는 무상 교환이에요. 책 한 권과 책 한 권을 바꿔요.</p>`;

    const me = () => (view.role === "requester" ? "requester" : "lister");
    const other = () => (me() === "lister" ? "requester" : "lister");
    const otherNick = () => (me() === "lister" ? OFFERS[0].nick : BOOK_X.nick);
    const otherBook = () => (me() === "lister" ? OFFERS[0] : BOOK_X);
    const myBook = () => (me() === "lister" ? BOOK_X : OFFERS[0]);

    const steps = () => {
      const order = ["listed", "requested", "confirmed", "held", "done"];
      const idx = order.indexOf(view.state);
      return `<ol class="steps">${order.map((s, i) => {
        const done = idx > i || view.state === "done";
        const now = idx === i && view.state !== "done";
        return `<li data-done="${done ? 1 : 0}" data-now="${now ? 1 : 0}"><span aria-hidden="true">${done ? "✓" : now ? "●" : "○"}</span>${STATES[s]}${now ? " (지금)" : done ? " (지남)" : ""}</li>`;
      }).join("")}</ol>`;
    };

    // ─── 둘러보기 (비로그인·요청자 등록됨) ───
    const browse = () => {
      const showX = view.state === "listed" && BOOK_X.district === ui.district;
      const list = [...(showX ? [BOOK_X] : []), ...OTHERS.filter((b) => b.district === ui.district)];
      return `
        <section class="stack">
          <h1>중고책 교환</h1>
          <p class="sub">동네(구)를 골라 교환할 책을 찾아요. 실시간 위치는 쓰지 않아요.</p>
          <label class="ds-field">동네
            <select class="ds-input" data-act="district">${DISTRICTS.map((d) => `<option${d === ui.district ? " selected" : ""}>${d}</option>`).join("")}</select>
          </label>
          ${list.length ? `<div class="grid">${list.map((b) => bookCard(b, b === BOOK_X ? `<button class="ds-btn ds-btn--primary ds-btn--block" data-act="open-x">교환 요청하기</button>` : "")).join("")}</div>`
            : `<div class="ds-card ds-empty"><p>${ui.district}에 지금 교환할 수 있는 책이 없어요.</p><button class="ds-btn" data-act="district-next">옆 동네 보기</button></div>`}
        </section>`;
    };

    const requestForm = () => `
      <section class="ds-card stack">
        <h2>내 책과 바꾸기</h2>
        ${bookCard(BOOK_X)}
        <fieldset>
          <legend>보낼 내 책 (등록해 둔 책 중 하나)</legend>
          ${MY_BOOKS.map((b) => `<label class="choice"><input type="radio" name="offer" value="${b.id}" data-act="offer"${ui.offer === b.id ? " checked" : ""}><span>${b.title} ${gradeTag(b.grade)}</span></label>`).join("")}
        </fieldset>
        ${free}
        <p class="ds-notice">수락되면 ${NUM.DROP_DAYS}일 안에 <b>${BOOK_X.store}</b>에 내 책을 맡겨야 해요. 기한을 넘기면 노쇼 1회로 기록되고, ${NUM.NOSHOW_WINDOW_DAYS}일 안에 ${NUM.NOSHOW_LIMIT}회면 ${NUM.SUSPEND_DAYS}일 동안 교환이 막혀요.</p>
        <div class="actions"><button class="ds-btn ds-btn--primary" data-act="send-request">교환 요청 보내기</button></div>
        <p class="sub">요청은 동시에 ${NUM.MAX_OUT_REQUESTS}건까지 보낼 수 있어요. 상대에게는 닉네임과 내 책만 보여요.</p>
      </section>`;

    // ─── 등록 폼 (등록자) ───
    const registerForm = () => {
      const r = ui.isbnResult;
      const canSubmit = r && r.ok && ui.grade && ui.photos > 0;
      return `
        <section class="ds-card stack">
          <h2>책 등록하기</h2>
          <div class="ds-field">
            <label for="isbn">ISBN</label>
            <div class="row"><input id="isbn" class="ds-input" style="flex:1 1 180px" inputmode="numeric" placeholder="예: 9788900000001" value="${ui.isbn}" data-act="isbn-input"><button class="ds-btn" data-act="isbn-search">검색</button></div>
            ${r ? (r.ok ? `<span class="ds-field__hint">찾았어요 — <b>${r.title}</b></span>`
              : `<span class="ds-field__hint ds-field__hint--error">이 번호로 책을 찾지 못했어요. 뒤표지 바코드 아래 13자리를 다시 확인해 주세요. ISBN 없는 책은 아직 교환할 수 없어요.</span>`) : `<span class="ds-field__hint">책은 ISBN으로 찾아요.</span>`}
          </div>
          <fieldset>
            <legend>상태 등급</legend>
            ${Object.entries(GRADES).map(([g, d]) => `<label class="choice"><input type="radio" name="grade" value="${g}" data-act="grade"${ui.grade === g ? " checked" : ""}><span><b>${g}</b> ${d}</span></label>`).join("")}
            <span class="ds-field__hint">낙장·심한 파손·곰팡이가 있으면 등록할 수 없어요.</span>
          </fieldset>
          <div class="ds-field">
            <span>사진 (1~${NUM.PHOTO_MAX}장, 표지·옆면·가장 낡은 곳)</span>
            <div class="photos">${Array.from({ length: ui.photos }, () => `<div class="ph" role="img" aria-label="올린 사진"></div>`).join("")}${ui.photos < NUM.PHOTO_MAX ? `<button class="ph ph--add" data-act="photo" aria-label="사진 추가">+</button>` : ""}</div>
          </div>
          <div class="two">
            <label class="ds-field">동네
              <select class="ds-input" data-act="reg-district">${DISTRICTS.map((d) => `<option${d === ui.regDistrict ? " selected" : ""}>${d}</option>`).join("")}</select>
            </label>
            <label class="ds-field">맡길 서점
              <select class="ds-input">${STORES[ui.regDistrict].map((s) => `<option>${s}</option>`).join("")}</select>
            </label>
          </div>
          ${free}
          <button class="ds-btn ds-btn--primary" data-act="register"${canSubmit ? "" : " disabled"}>등록하기</button>
          ${canSubmit ? "" : `<p class="sub">ISBN 검색 · 상태 등급 · 사진 1장 이상을 채우면 등록할 수 있어요.</p>`}
          <p class="sub">동시에 ${NUM.MAX_LISTINGS}권까지 올려 둘 수 있어요. 목록에는 닉네임이 보이지 않아요.</p>
        </section>`;
    };

    // ─── 진행 카드 (확정·보관 중 공통) ───
    const progress = () => {
      const m = me(), o = other();
      const head = `<section class="ds-card stack"><div class="row"><h2 style="margin:0">교환 진행 중</h2>${tag(STATES[view.state], "brand")}</div>
        <div class="two">${bookCard(myBook(), `<span class="sub">내가 보내는 책</span>`)}${bookCard(otherBook(), `<span class="sub">${otherNick()} 님에게서 받는 책</span>`)}</div>
        ${steps()}</section>`;
      if (view.state === "confirmed") {
        return `${head}
          <section class="ds-card stack">
            <h2>${BOOK_X.store}에 맡기기</h2>
            ${ui.drop[m] ? `<p>${tag("✓ 맡김 완료", "success")} 상대가 맡기기를 기다리고 있어요.</p>`
              : `<p>서점 계산대에서 이 코드를 보여 주세요. 이름·연락처는 묻지 않아요.</p><p class="code" aria-label="맡김 코드">${CODES.drop[m]}</p>
                 <p class="sub">${NUM.DROP_DAYS}일 안에 맡겨 주세요 (남은 시간 2일 5시간).</p>
                 <button class="ds-btn" data-act="drop-me">(데모) 서점이 내 코드를 확인함</button>`}
            <p class="sub">상대: ${ui.drop[o] ? "✓ 맡김 완료" : "아직 안 맡김"}</p>
            ${ui.drop[o] ? "" : `<button class="ds-btn" data-act="drop-other">(데모) 상대가 맡김</button>`}
            <button class="ds-btn ds-btn--danger" data-act="cancel">교환 취소</button>
            <p class="sub">확정 뒤 취소하면 노쇼 1회로 기록돼요. 이미 맡긴 책은 ${NUM.RETURN_DAYS}일 안에 되찾아 가요.</p>
          </section>`;
      }
      return `${head}
        <section class="ds-card stack">
          <h2>${BOOK_X.store}에서 받아 가기</h2>
          ${ui.pick[m] ? `<p>${tag("✓ 받아 감", "success")} 상대가 받아 가면 교환이 끝나요.</p>`
            : `<p>두 권 모두 서점에 도착했어요. 이 코드로 받아 가세요.</p><p class="code" aria-label="픽업 코드">${CODES.pick[m]}</p>
               <p class="sub">${NUM.HOLD_DAYS}일 안에 받아 가 주세요. 기한을 넘기면 미픽업 노쇼 1회로 기록돼요.</p>
               <button class="ds-btn ds-btn--primary" data-act="pick-me">(데모) 서점이 픽업 코드를 확인함</button>`}
          <p class="sub">상대: ${ui.pick[o] ? "✓ 받아 감" : "아직 안 받아 감"}</p>
          ${ui.pick[o] ? "" : `<button class="ds-btn" data-act="pick-other">(데모) 상대가 받아 감</button>`}
        </section>`;
    };

    const doneCard = () => `
      <section class="ds-card stack">
        <div class="row"><h2 style="margin:0">교환 완료</h2>${tag("✓ 완료", "success")}</div>
        ${bookCard(otherBook(), `<span class="sub">${otherNick()} 님에게서 받은 책</span>`)}
        ${steps()}
        ${ui.reporting ? `
          <div class="stack">
            <h3>신고하기</h3>
            <p class="sub">공통 신고로 접수돼요. 사유를 고르고 사진을 붙여 주세요.</p>
            <label class="choice"><input type="radio" name="why" checked><span>상태 등급이 설명과 달라요</span></label>
            <label class="choice"><input type="radio" name="why"><span>다른 책이 왔어요</span></label>
            <label class="choice"><input type="radio" name="why"><span>불쾌한 내용(낙서·끼워 둔 물건)</span></label>
            <div class="actions"><button class="ds-btn ds-btn--primary" data-act="report-send">신고 접수</button><button class="ds-btn" data-act="report-close">닫기</button></div>
          </div>`
          : `<p class="sub">받은 책 상태가 등급과 다르면 받은 뒤 ${NUM.DISPUTE_HOURS}시간 안에 신고해 주세요. 운영자가 양쪽 사진을 보고 판단해요.</p>
             <div class="actions"><button class="ds-btn" data-act="report">신고하기</button><button class="ds-btn ds-btn--primary" data-act="restart">다른 책 둘러보기</button></div>`}
      </section>`;

    const closedCard = () => {
      const reasons = {
        drop: me() === "lister" ? `${otherNick()} 님이 ${NUM.DROP_DAYS}일 안에 책을 맡기지 않아 교환이 만료됐어요.` : `${NUM.DROP_DAYS}일 안에 내 책을 맡기지 않아 교환이 만료됐어요. 노쇼 1회로 기록됐어요 (${NUM.NOSHOW_WINDOW_DAYS}일 안에 ${NUM.NOSHOW_LIMIT}회면 ${NUM.SUSPEND_DAYS}일 동안 교환 제한).`,
        admin: "운영자가 교환을 취소했어요.",
        cancel: "교환을 취소했어요.",
      };
      const mine = me() === "lister";
      return `
        <section class="ds-card stack">
          <div class="row"><h2 style="margin:0">교환이 끝나지 못했어요</h2>${tag("만료·취소", "danger")}</div>
          <p>${reasons[ui.closedReason]}</p>
          ${mine && ui.drop.lister ? `<p>맡긴 내 책은 ${NUM.RETURN_DAYS}일 안에 ${BOOK_X.store}에서 되찾아 가세요.</p><p class="code" aria-label="반환 코드">${CODES.pick.lister}</p>` : ""}
          <div class="actions">
            ${mine ? `<button class="ds-btn ds-btn--primary" data-act="relist">내 책 다시 등록</button>` : ""}
            <button class="ds-btn" data-act="restart">다른 책 둘러보기</button>
          </div>
        </section>`;
    };

    // ─── 역할별 화면 ───
    const screens = {
      guest: () => `${browse()}
        <section class="ds-card stack"><p>교환 요청·등록은 로그인 뒤에 할 수 있어요.</p><button class="ds-btn ds-btn--primary" data-act="login">로그인하고 교환하기</button></section>`,

      lister: () => {
        const s = view.state;
        if (s === "listed") {
          return `<h1>내 교환 책</h1>
            ${ui.myListings.map((b) => bookCard(b, `${tag("등록됨")}<span class="sub">교환 요청을 기다리고 있어요.</span>`)).join("")}
            ${registerForm()}
            <section class="ds-card"><button class="ds-btn ds-btn--block" data-act="demo-request">(데모) 다른 독자가 교환을 요청함</button></section>`;
        }
        if (s === "requested") {
          return `<h1>교환 요청 ${OFFERS.length}건</h1>
            ${bookCard(BOOK_X, tag("요청 받음", "brand"))}
            ${OFFERS.map((o) => `
              <section class="ds-card stack">
                <p><b>${o.nick}</b> 님이 이 책과 바꾸고 싶어 해요.</p>
                ${bookCard(o, `<div class="photos"><div class="ph"></div><div class="ph"></div></div>`)}
                <div class="actions"><button class="ds-btn ds-btn--primary" data-act="accept" data-id="${o.id}">수락</button><button class="ds-btn" data-act="decline" data-id="${o.id}">거절</button></div>
              </section>`).join("")}
            <p class="sub">하나를 수락하면 나머지 요청은 자동으로 거절돼요. ${NUM.REQUEST_REPLY_DAYS}일 안에 답하지 않으면 요청이 만료돼요.</p>`;
        }
        if (s === "confirmed" || s === "held") return progress();
        if (s === "done") return doneCard();
        return closedCard();
      },

      requester: () => {
        const s = view.state;
        if (s === "listed") return `${browse()}${ui.requesting ? requestForm() : ""}`;
        if (s === "requested") {
          return `<h1>보낸 요청</h1>
            <section class="ds-card stack">
              ${bookCard(BOOK_X, tag("응답 기다리는 중"))}
              <p class="sub">${BOOK_X.nick} 님이 ${NUM.REQUEST_REPLY_DAYS}일 안에 답하지 않으면 요청이 만료돼요. 내 책은 그동안 다른 요청에도 쓸 수 있어요.</p>
              <div class="actions"><button class="ds-btn ds-btn--danger" data-act="withdraw">요청 취소</button><button class="ds-btn" data-act="demo-accept">(데모) 상대가 수락함</button></div>
            </section>`;
        }
        if (s === "confirmed" || s === "held") return progress();
        if (s === "done") return doneCard();
        return closedCard();
      },

      admin: () => {
        const final = view.state === "done" || view.state === "closed";
        return `<h1>교환 건 SW-20261007-0042</h1>
          <p class="ds-notice">이 화면을 연 기록이 감사 로그에 남아요 (열람자·시각·건 번호).</p>
          <section class="ds-card stack">
            <div class="row">${tag(STATES[view.state], "brand")}${tag(BOOK_X.district)}${tag(`맡김 ${BOOK_X.store}`)}</div>
            <div class="two">${bookCard(BOOK_X, `<span class="sub">등록자 ${BOOK_X.nick}</span>`)}${bookCard(OFFERS[0], `<span class="sub">요청자 ${OFFERS[0].nick}</span>`)}</div>
            ${steps()}
            <p class="sub">맡김: 등록자 ${ui.drop.lister ? "✓" : "—"} · 요청자 ${ui.drop.requester ? "✓" : "—"} / 픽업: 등록자 ${ui.pick.lister ? "✓" : "—"} · 요청자 ${ui.pick.requester ? "✓" : "—"}</p>
            <p class="sub">닉네임과 건 번호만 보여요. 실명·연락처는 이 화면에 없어요.</p>
          </section>
          ${final ? `<section class="ds-card stack"><p>끝난 건이에요. 등급 분쟁 신고는 공통 신고 처리 화면에서 다뤄요.</p><a class="ds-btn" href="#" data-act="noop">신고 처리로 가기</a></section>`
            : `<section class="ds-card stack">
                <h2>강제 취소</h2>
                <label class="ds-field">사유 (필수 — 감사 로그에 남아요)
                  <textarea class="ds-input" data-act="cancel-reason" placeholder="예: 신고 확인 — 등록 사진과 다른 책">${ui.cancelReason}</textarea>
                </label>
                ${ui.toast === "need-reason" ? `<p class="ds-field__hint ds-field__hint--error">사유를 적어야 취소할 수 있어요.</p>` : ""}
                <button class="ds-btn ds-btn--danger" data-act="admin-cancel">이 교환 취소</button>
                <p class="sub">취소하면 양쪽에 알림이 가고, 이미 맡긴 책은 반환 코드로 ${NUM.RETURN_DAYS}일 안에 되찾아 가요. 노쇼로 세지 않아요.</p>
              </section>`}`;
      },
    };

    const TOASTS = {
      requested: "교환 요청을 보냈어요.", accepted: "수락했어요. 서점에 책을 맡겨 주세요.", declined: "요청을 거절했어요.",
      registered: "등록했어요.", reported: "신고를 접수했어요. 처리 결과는 알림으로 알려 드려요.", withdrawn: "요청을 취소했어요.",
      held: "두 권 모두 서점에 도착했어요.", done: "교환이 끝났어요.", cancelled: "교환을 취소했어요.", "admin-cancelled": "취소하고 감사 로그에 남겼어요.",
    };

    const app = document.getElementById("app");
    const roleSel = document.getElementById("role");
    const stateSel = document.getElementById("state");
    const render = () => {
      const msg = TOASTS[ui.toast];
      app.innerHTML = screens[view.role]() + (msg ? `<p class="ds-notice toast" role="status">${msg}</p>` : "");
    };

    // ─── 이벤트 (data-act 위임) ───
    const ACTS = {
      district: (el) => { ui.district = el.value; render(); },
      "district-next": () => { ui.district = DISTRICTS[(DISTRICTS.indexOf(ui.district) + 1) % DISTRICTS.length]; render(); },
      "open-x": () => {
        if (view.role === "guest") return ACTS.login();
        ui.requesting = true; ui.toast = ""; render();
      },
      login: () => { view.role = "requester"; roleSel.value = "requester"; ui.toast = ""; render(); },
      offer: (el) => { ui.offer = el.value; },
      "send-request": () => { ui.requesting = false; go("requested", "requested"); },
      withdraw: () => go("listed", "withdrawn"),
      "demo-accept": () => go("confirmed", "accepted"),
      "demo-request": () => go("requested"),
      accept: () => go("confirmed", "accepted"),
      decline: () => go("listed", "declined"),
      "isbn-input": (el) => { ui.isbn = el.value.trim(); },
      "isbn-search": () => {
        const t = CATALOG[ui.isbn];
        ui.isbnResult = t ? { ok: true, title: t } : { ok: false };
        render();
      },
      grade: (el) => { ui.grade = el.value; render(); },
      photo: () => { ui.photos = Math.min(NUM.PHOTO_MAX, ui.photos + 1); render(); },
      "reg-district": (el) => { ui.regDistrict = el.value; render(); },
      register: () => {
        const r = ui.isbnResult;
        if (!(r && r.ok && ui.grade && ui.photos > 0)) return;
        ui.myListings.push({ title: r.title, grade: ui.grade, district: ui.regDistrict, store: STORES[ui.regDistrict][0] });
        Object.assign(ui, { isbn: "", isbnResult: null, grade: "", photos: 0, toast: "registered" });
        render();
      },
      "drop-me": () => { ui.drop[me()] = true; afterDrop(); },
      "drop-other": () => { ui.drop[other()] = true; afterDrop(); },
      "pick-me": () => { ui.pick[me()] = true; afterPick(); },
      "pick-other": () => { ui.pick[other()] = true; afterPick(); },
      cancel: () => { ui.closedReason = "cancel"; const d = { ...ui.drop }; go("closed", "cancelled"); ui.drop = d; render(); },
      report: () => { ui.reporting = true; ui.toast = ""; render(); },
      "report-close": () => { ui.reporting = false; render(); },
      "report-send": () => { ui.reporting = false; ui.toast = "reported"; render(); },
      restart: () => { ui.reporting = false; if (view.role === "lister") { view.role = "requester"; roleSel.value = "requester"; } go("listed"); },
      relist: () => go("listed"),
      "cancel-reason": (el) => { ui.cancelReason = el.value; },
      "admin-cancel": () => {
        if (!ui.cancelReason.trim()) { ui.toast = "need-reason"; return render(); }
        ui.closedReason = "admin"; ui.cancelReason = ""; go("closed", "admin-cancelled");
      },
      noop: () => {},
    };
    const afterDrop = () => (ui.drop.lister && ui.drop.requester ? go("held", "held") : render());
    const afterPick = () => (ui.pick.lister && ui.pick.requester ? go("done", "done") : render());

    app.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      if (!el || el.tagName === "SELECT" || el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type !== "radio")) return;
      if (el.tagName === "A") e.preventDefault();
      if (el.type === "radio") return;
      ACTS[el.dataset.act]?.(el);
    });
    app.addEventListener("change", (e) => {
      const el = e.target.closest("[data-act]");
      if (el && (el.tagName === "SELECT" || el.type === "radio")) ACTS[el.dataset.act]?.(el);
    });
    app.addEventListener("input", (e) => {
      const el = e.target.closest("[data-act]");
      if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT") && el.type !== "radio") ACTS[el.dataset.act]?.(el);
    });

    fill(roleSel, ROLES, view.role);
    fill(stateSel, STATES, view.state);
    roleSel.onchange = () => { view.role = roleSel.value; ui.toast = ""; ui.reporting = false; ui.requesting = false; render(); };
    stateSel.onchange = () => { view.state = stateSel.value; ui.closedReason = "drop"; ui.toast = ""; ui.reporting = false; syncFlags(); render(); };
    document.addEventListener("ds:change", render);
    syncFlags();
    render();
  </script>
</body>
</html>
