<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팬레터 프로토타입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { --bg: #0b0b10; --panel: #15151d; --line: #262633; --text: #f4f4f6; --sub: #9a9aab; --brand: #8956fb; --mine: #2a2140; --warn: #ff7a7a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--text); letter-spacing: -0.01em; }
    button, textarea, input { font: inherit; color: inherit; }
    #view { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 8px 16px; background: #1b1b24; font-size: 13px; border-bottom: 1px dashed #444; }
    #view select { background: #0b0b10; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
    #app { max-width: 480px; margin: 0 auto; min-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--panel); }
    @media (min-width: 1024px) { #app { max-width: 720px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3a3a4a; flex: none; }
    .name { font-weight: 700; }
    .sub { color: var(--sub); font-size: 13px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; min-height: 44px; padding: 0 8px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--sub); cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--brand); font-weight: 700; }
    .feed { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: #2d2d3a; color: var(--sub); margin-left: 4px; }
    .tag.brand { background: rgba(137, 86, 251, 0.18); color: #c9b3ff; }
    .tag.warn { background: rgba(255, 122, 122, 0.15); color: var(--warn); }
    textarea { width: 100%; resize: vertical; min-height: 160px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: #0f0f15; line-height: 1.5; }
    textarea:disabled { opacity: 0.5; }
    .btn { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--brand); font-weight: 700; cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.ghost { background: #23232e; font-weight: 500; }
    .btn.warn { background: rgba(255, 122, 122, 0.15); color: var(--warn); font-weight: 500; }
    .btn.sm { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
    .hint { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .over { color: var(--warn); }
    .card { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .card.new { border-color: rgba(137, 86, 251, 0.6); }
    .body { line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
    .thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; background: #3a3a4a; }
    .thumb button { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: #555; cursor: pointer; font-size: 12px; }
    .opts { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .opts label { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .opts input { width: 18px; height: 18px; accent-color: var(--brand); }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 24px; text-align: center; }
    .empty { color: var(--sub); text-align: center; padding: 32px 0; line-height: 1.6; }
    .notice { padding: 10px 12px; border-radius: 12px; background: #1f1f2a; font-size: 13px; color: var(--sub); line-height: 1.5; }
    .section-title { font-size: 13px; color: var(--sub); margin-top: 8px; }
    .reader { position: fixed; inset: 0; z-index: 20; background: rgba(5, 5, 8, 0.96); display: flex; flex-direction: column; padding: 24px 16px; gap: 16px; overflow-y: auto; }
    .reader .body { font-size: 22px; max-width: 720px; margin: 0 auto; width: 100%; }
    .reader .actions { max-width: 720px; margin: 0 auto; width: 100%; }
    .reasons { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border-radius: 12px; background: #1f1f2a; }
  </style>
</head>
<body>
  <!-- 보기 전환 — SPEC.md 권한 표·상태 변화 표를 눈으로 대조하는 장치. 프로토타입 화면의 일부가 아니다. -->
  <div id="view">
    <label>역할 <select id="role"></select></label>
    <label>상태 <select id="state"></select></label>
  </div>

  <div id="app"></div>

  <script>
    // 숫자는 여기 한 곳 — SPEC.md 「숫자」 절과 같은 값.
    const NUM = {
      letterMin: 10,
      letterMax: 1000,
      attachMax: 3,
      attachMaxMB: 10,
      dailyPerChannel: 3,
      queueMax: 20,
      keepDays: 180,
    };
    const ROLES = { guest: "비로그인", writer: "일반 회원(작성자)", owner: "방송인", admin: "운영자" };
    const STATES = {
      empty: "편지 없음",
      received: "받은 편지 있음",
      queued: "소개 예정 있음",
      aired: "소개 완료(공개)",
      reported: "신고 접수됨",
      blocked: "작성자 차단됨",
    };
    const STATUS_FOR_WRITER = { new: "보냄", read: "읽음", queued: "소개 예정", aired: "방송에서 소개됨", hidden: "운영 정책으로 숨김" };
    const REASONS = ["욕설·괴롭힘", "개인정보 노출", "광고·스팸", "기타"];

    const ME = "별사탕";
    const OWNER = "달빛하루";
    const ANON = "익명의 팬";

    // 가짜 데이터 — 실데이터 금지.
    const base = () => [
      { id: 1, from: "고양이발", anon: false, consent: true, at: "3일 전", attach: 1, status: "read", text: "처음 방송 본 날이 벌써 일 년이네요. 그때 부른 노래 아직도 매일 들어요. 늘 고마워요!" },
      { id: 2, from: ME, anon: true, consent: true, at: "어제", attach: 0, status: "read", text: "시험 기간에 틀어 두고 공부했는데 결과가 잘 나왔어요. 달빛하루님 덕분이에요. 다음 노래 방송도 기다릴게요." },
      { id: 3, from: "새벽두시", anon: false, consent: false, at: "오늘 01:12", attach: 2, status: "new", text: "요즘 힘든 일이 있었는데 방송 보면서 많이 웃었어요. 이건 방송에서 안 읽어 주셔도 돼요. 그냥 전하고 싶었어요." },
      { id: 4, from: "초코우유", anon: false, consent: true, at: "오늘 09:40", attach: 0, status: "new", text: "생일 축하드려요!! 케이크 그림 그려서 보내려다가 실력이 부족해서 글로만 보내요 🎂" },
    ];
    const seed = (state) => {
      const letters = state === "empty" ? [] : base().map((l) => ({ ...l, reported: false, reason: null, public: false }));
      const find = (id) => letters.find((l) => l.id === id);
      if (state === "queued" || state === "aired") { find(1).status = "queued"; find(2).status = "queued"; }
      if (state === "aired") { find(1).status = "aired"; find(1).public = true; find(2).status = "aired"; find(2).public = true; }
      if (state === "reported" || state === "blocked") {
        letters.push({ id: 5, from: "구름빵", anon: false, consent: true, at: "오늘 10:05", attach: 0, status: "read", text: "왜 내 후원 메시지는 안 읽어 줌? 계속 무시하면 다른 데 올릴 거임", reported: true, reason: "욕설·괴롭힘", public: false });
      }
      return {
        letters,
        blocked: state === "blocked" ? [ME] : [],
        sentToday: state === "empty" ? 0 : 1,
      };
    };

    const view = { role: "writer", state: "received", tab: null, open: null, reportFor: null, reading: null, draft: { text: "", attach: 0, consent: true, anon: false }, toast: "" };
    let data = seed(view.state);
    const TABS = {
      writer: [["write", "편지 쓰기"], ["sent", "보낸 편지"], ["public", "소개된 편지"]],
      owner: [["inbox", "받은 편지"], ["queue", "소개 예정"], ["public", "소개된 편지"]],
    };

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const shown = (l) => (l.anon ? ANON : l.from);
    const len = (s) => [...s].length;
    const thumbs = (n, removable = false) => n ? `<div class="thumbs">${Array.from({ length: n }, (_, i) => `<div class="thumb" aria-label="첨부 이미지 ${i + 1}">${removable ? `<button data-detach="${i}" aria-label="첨부 빼기">×</button>` : ""}</div>`).join("")}</div>` : "";
    const visible = () => data.letters.filter((l) => !l.reported && l.status !== "hidden");
    const publicList = () => data.letters.filter((l) => l.status === "aired" && l.public);
    const app = document.getElementById("app");

    const header = (sub) => `
      <header>
        <div class="avatar"></div>
        <div><div class="name">${OWNER} <span class="tag brand">팬레터</span></div><div class="sub">${sub}</div></div>
      </header>`;
    const tabs = (role) => `<div class="tabs" role="tablist">${TABS[role].map(([k, t]) => {
      const n = role === "owner" && k === "inbox" ? visible().filter((l) => l.status === "new").length
        : role === "owner" && k === "queue" ? data.letters.filter((l) => l.status === "queued").length : 0;
      return `<button role="tab" aria-selected="${view.tab === k}" data-tab="${k}">${t}${n ? ` <span class="tag brand">${n}</span>` : ""}</button>`;
    }).join("")}</div>`;
    const toast = () => (view.toast ? `<div class="notice" role="status">${view.toast}</div>` : "");

    const publicFeed = (canUnpublish) => {
      const list = publicList();
      return `<div class="feed">
        <div class="notice">방송에서 소개된 편지 중 작성자가 공개를 허락한 것만 여기 보여요. 첨부 이미지는 공개되지 않아요.</div>
        ${list.length === 0 ? `<div class="empty">아직 방송에서 소개된 편지가 없어요.</div>` : ""}
        ${list.map((l) => `<div class="card">
          <div><span class="name">${esc(shown(l))}</span><span class="tag brand">방송에서 소개됨</span></div>
          <div class="body">${esc(l.text)}</div>
          ${canUnpublish(l) ? `<div class="actions"><button class="btn ghost sm" data-unpublish="${l.id}">공개 내리기</button></div>` : ""}
        </div>`).join("")}
      </div>`;
    };

    // ─── 비로그인 ───
    const guestScreen = () => `${header("팬레터를 받고 있어요")}
      <div class="feed">
        <div class="card">
          <div class="name">${OWNER}님에게 편지를 보내 보세요</div>
          <div class="sub">편지는 ${OWNER}님만 읽어요. 방송에서 소개될 수도 있어요.</div>
          <button class="btn" data-login>로그인하고 편지 쓰기</button>
        </div>
        <div class="section-title">소개된 편지</div>
      </div>
      ${publicFeed(() => false)}`;

    // ─── 작성자 ───
    const writeTab = () => {
      const blocked = data.blocked.includes(ME);
      const left = NUM.dailyPerChannel - data.sentToday;
      const d = view.draft;
      const n = len(d.text);
      const ok = !blocked && left > 0 && n >= NUM.letterMin && n <= NUM.letterMax;
      if (blocked) return `<div class="feed"><div class="center">
        <div class="name">지금은 이 채널에 편지를 보낼 수 없어요</div>
        <div class="sub">보낸 편지는 「보낸 편지」에서 계속 볼 수 있어요.</div>
        <button class="btn ghost" data-tab="sent">보낸 편지 보기</button>
      </div></div>`;
      return `<div class="feed">
        ${toast()}
        <div class="notice">편지는 ${OWNER}님만 읽어요. 아래에서 허락하면 방송에서 소개될 수 있고, 소개된 편지는 「소개된 편지」에 공개돼요.</div>
        <textarea id="letter" placeholder="${OWNER}님에게 하고 싶은 말" ${left <= 0 ? "disabled" : ""}>${esc(d.text)}</textarea>
        <div class="hint">
          <span>${left > 0 ? `오늘 이 채널에 ${left}통 더 보낼 수 있어요` : `<span class="over">오늘은 더 보낼 수 없어요. 내일 다시 보낼 수 있어요</span>`}</span>
          <span data-count class="${n > NUM.letterMax ? "over" : ""}">${n} / ${NUM.letterMax}</span>
        </div>
        ${thumbs(d.attach, true)}
        <div class="actions"><button class="btn ghost sm" data-attach ${d.attach >= NUM.attachMax ? "disabled" : ""}>사진 추가 (${d.attach}/${NUM.attachMax})</button></div>
        <div class="opts">
          <label><input type="checkbox" data-opt="consent" ${d.consent ? "checked" : ""}> 방송에서 소개해도 좋아요</label>
          <label><input type="checkbox" data-opt="anon" ${d.anon ? "checked" : ""} ${d.consent ? "" : "disabled"}> 소개할 때 닉네임 대신 「${ANON}」로</label>
        </div>
        <button class="btn" data-sendletter ${ok ? "" : "disabled"}>편지 보내기</button>
        <div class="hint"><span>${NUM.letterMin}자 이상 써야 보낼 수 있어요. ${OWNER}님이 읽기 전까지는 회수할 수 있어요.</span></div>
      </div>`;
    };
    const sentTab = () => {
      const list = data.letters.filter((l) => l.from === ME).reverse();
      return `<div class="feed">
        ${toast()}
        ${list.length === 0 ? `<div class="empty">아직 보낸 편지가 없어요.<br><button class="btn" data-tab="write">첫 편지 쓰기</button></div>` : ""}
        ${list.map((l) => {
          const st = l.status === "hidden" ? "hidden" : l.status;
          return `<div class="card">
            <div class="hint"><span>${l.at}</span><span><span class="tag ${st === "queued" || st === "aired" ? "brand" : ""}">${STATUS_FOR_WRITER[st]}</span></span></div>
            <div class="body">${esc(l.text)}</div>
            ${thumbs(l.attach)}
            <div class="sub">${l.consent ? `소개 허락 · ${l.anon ? ANON : "닉네임"}으로` : "소개 안 함"}</div>
            <div class="actions">
              ${st === "new" ? `<button class="btn ghost sm" data-withdraw="${l.id}">회수하기</button>` : ""}
              ${st === "aired" && l.public ? `<button class="btn ghost sm" data-unpublish="${l.id}">공개 내리기</button>` : ""}
            </div>
          </div>`;
        }).join("")}
      </div>`;
    };
    const writerScreen = () => `${header(`편지는 ${OWNER}님만 읽어요`)}${tabs("writer")}
      ${view.tab === "write" ? writeTab() : view.tab === "sent" ? sentTab() : publicFeed((l) => l.from === ME)}`;

    // ─── 방송인 ───
    const inboxTab = () => {
      const list = visible().filter((l) => l.status === "new" || l.status === "read").reverse();
      const pending = data.letters.filter((l) => l.reported && l.status !== "hidden").length;
      return `<div class="feed">
        ${toast()}
        ${data.blocked.length ? `<div class="notice">차단한 팬 ${data.blocked.length}명 — 새 편지를 받지 않아요. <button class="btn ghost sm" data-unblock>모두 해제</button></div>` : ""}
        ${pending ? `<div class="notice">신고한 편지 ${pending}통은 운영 검토 중이라 편지함에서 숨겼어요.</div>` : ""}
        ${list.length === 0 ? `<div class="empty">아직 받은 편지가 없어요.<br>방송에서 팬레터 주소를 알려 보세요.</div>` : ""}
        ${list.map((l) => {
          const opened = view.open === l.id;
          const full = data.letters.filter((x) => x.status === "queued").length >= NUM.queueMax;
          return `<div class="card ${l.status === "new" ? "new" : ""}">
            <div class="hint"><span><span class="name">${esc(l.from)}</span>${l.status === "new" ? `<span class="tag brand">새 편지</span>` : ""}${l.consent ? `<span class="tag">소개 허락${l.anon ? " · 익명" : ""}</span>` : `<span class="tag">소개 비동의</span>`}</span><span>${l.at}</span></div>
            <div class="body">${esc(opened ? l.text : `${[...l.text].slice(0, 40).join("")}${len(l.text) > 40 ? "…" : ""}`)}</div>
            ${opened ? thumbs(l.attach) : ""}
            ${view.reportFor === l.id ? `<div class="reasons">${REASONS.map((r) => `<button class="btn ghost sm" data-reason="${r}">${r}</button>`).join("")}<button class="btn ghost sm" data-report-cancel>취소</button></div>` : ""}
            <div class="actions">
              ${opened ? "" : `<button class="btn ghost sm" data-open="${l.id}">펼쳐 읽기</button>`}
              <button class="btn sm" data-queue="${l.id}" ${l.consent && !full ? "" : "disabled"}>${l.consent ? "소개 예정에 담기" : "소개 비동의 편지"}</button>
              <button class="btn warn sm" data-report="${l.id}">신고</button>
              <button class="btn warn sm" data-block="${l.id}">이 팬 차단</button>
            </div>
          </div>`;
        }).join("")}
      </div>`;
    };
    const queueTab = () => {
      const list = data.letters.filter((l) => l.status === "queued");
      return `<div class="feed">
        ${toast()}
        <div class="notice">방송에서 읽을 편지예요 (${list.length}/${NUM.queueMax}). 소개 완료를 누르면 작성자에게 알리고 「소개된 편지」에 공개돼요.</div>
        ${list.length === 0 ? `<div class="empty">소개 예정인 편지가 없어요.<br>받은 편지에서 골라 담아 보세요.</div>` : ""}
        ${list.map((l) => `<div class="card">
          <div><span class="name">${esc(shown(l))}</span>${l.anon ? `<span class="tag">방송에서는 익명</span>` : ""}</div>
          <div class="body">${esc(l.text)}</div>
          <div class="actions">
            <button class="btn sm" data-read="${l.id}">읽기 화면</button>
            <button class="btn ghost sm" data-aired="${l.id}">소개 완료</button>
            <button class="btn ghost sm" data-unqueue="${l.id}">빼기</button>
          </div>
        </div>`).join("")}
      </div>`;
    };
    const reader = () => {
      const l = data.letters.find((x) => x.id === view.reading);
      if (!l) return "";
      return `<div class="reader" role="dialog" aria-label="편지 읽기 화면">
        <div class="sub" style="max-width:720px;margin:0 auto;width:100%">${esc(shown(l))}님의 편지 · 첨부 이미지는 이 화면에 띄우지 않아요</div>
        <div class="body">${esc(l.text)}</div>
        <div class="actions"><button class="btn" data-aired="${l.id}">소개 완료</button><button class="btn ghost" data-close-reader>닫기</button></div>
      </div>`;
    };
    const ownerScreen = () => `${header(`받은 편지 ${visible().length}통`)}${tabs("owner")}
      ${view.tab === "inbox" ? inboxTab() : view.tab === "queue" ? queueTab() : publicFeed(() => true)}${reader()}`;

    // ─── 운영자 ───
    const adminScreen = () => {
      const list = data.letters.filter((l) => l.reported);
      return `<header><div><div class="name">신고된 팬레터</div><div class="sub">신고된 편지만 열람할 수 있어요. 처리 기록이 남아요.</div></div></header>
        <div class="feed">
          ${toast()}
          ${list.length === 0 ? `<div class="empty">검토할 신고가 없어요.</div>` : ""}
          ${list.map((l) => `<div class="card">
            <div class="hint"><span><span class="name">${esc(l.from)}</span> → ${OWNER}</span><span>${l.at}</span></div>
            <div><span class="tag warn">${esc(l.reason)}</span>${l.status === "hidden" ? `<span class="tag">숨김 처리됨</span>` : ""}</div>
            <div class="body">${esc(l.text)}</div>
            ${l.status === "hidden" ? "" : `<div class="actions">
              <button class="btn warn sm" data-hide="${l.id}">숨기고 작성자 경고</button>
              <button class="btn ghost sm" data-dismiss="${l.id}">문제 없음 · 편지함에 돌려놓기</button>
            </div>`}
          </div>`).join("")}
        </div>`;
    };

    const SCREENS = { guest: guestScreen, writer: writerScreen, owner: ownerScreen, admin: adminScreen };
    const render = () => {
      if (TABS[view.role] && !TABS[view.role].some(([k]) => k === view.tab)) view.tab = TABS[view.role][0][0];
      app.innerHTML = SCREENS[view.role]();
    };

    app.addEventListener("input", (e) => {
      if (e.target.id !== "letter") return;
      view.draft.text = e.target.value;
      const n = len(view.draft.text);
      const count = app.querySelector("[data-count]");
      count.textContent = `${n} / ${NUM.letterMax}`;
      count.classList.toggle("over", n > NUM.letterMax);
      app.querySelector("[data-sendletter]").disabled = n < NUM.letterMin || n > NUM.letterMax;
    });

    app.addEventListener("change", (e) => {
      const opt = e.target.dataset.opt;
      if (!opt) return;
      view.draft[opt] = e.target.checked;
      if (!view.draft.consent) view.draft.anon = false;
      render();
    });

    app.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const d = b.dataset;
      const byId = (v) => data.letters.find((l) => l.id === Number(v));
      view.toast = "";
      if (d.tab) { view.tab = d.tab; view.open = null; view.reportFor = null; }
      if ("login" in d) { view.role = "writer"; role.value = "writer"; view.tab = "write"; }
      if ("attach" in d) view.draft.attach = Math.min(NUM.attachMax, view.draft.attach + 1);
      if (d.detach) view.draft.attach -= 1;
      if ("sendletter" in d) {
        const { text, attach, consent, anon } = view.draft;
        data.letters.push({ id: Date.now(), from: ME, anon, consent, at: "방금", attach, status: "new", text: text.trim(), reported: false, reason: null, public: false });
        data.sentToday += 1;
        view.draft = { text: "", attach: 0, consent: true, anon: false };
        view.tab = "sent";
        view.toast = `편지를 보냈어요. ${OWNER}님이 읽으면 「읽음」으로 바뀌어요.`;
      }
      if (d.withdraw) { data.letters = data.letters.filter((l) => l.id !== Number(d.withdraw)); view.toast = "편지를 회수했어요. 오늘 보낸 횟수는 돌아오지 않아요."; }
      if (d.unpublish) { byId(d.unpublish).public = false; view.toast = "공개를 내렸어요. 다시 공개할 수는 없어요."; }
      if (d.open) { view.open = Number(d.open); const l = byId(d.open); if (l.status === "new") l.status = "read"; }
      if (d.queue) { const l = byId(d.queue); l.status = "queued"; view.toast = `${esc(shown(l))}님의 편지를 소개 예정에 담았어요.`; }
      if (d.unqueue) byId(d.unqueue).status = "read";
      if (d.read) view.reading = Number(d.read);
      if ("closeReader" in d) view.reading = null;
      if (d.aired) { const l = byId(d.aired); l.status = "aired"; l.public = true; view.reading = null; view.toast = "소개 완료로 바꿨어요. 작성자에게 알림이 가요."; }
      if (d.report) view.reportFor = Number(d.report);
      if ("reportCancel" in d) view.reportFor = null;
      if (d.reason) { const l = byId(view.reportFor); l.reported = true; l.reason = d.reason; view.reportFor = null; view.toast = "신고했어요. 운영 검토가 끝날 때까지 편지함에서 숨겨요."; }
      if (d.block) { const l = byId(d.block); if (!data.blocked.includes(l.from)) data.blocked.push(l.from); view.toast = `${esc(l.from)}님을 차단했어요. 이미 받은 편지는 그대로 남아요.`; }
      if ("unblock" in d) { data.blocked = []; view.toast = "차단을 모두 해제했어요."; }
      if (d.hide) { byId(d.hide).status = "hidden"; view.toast = "편지를 숨기고 작성자에게 경고를 보냈어요."; }
      if (d.dismiss) { const l = byId(d.dismiss); l.reported = false; l.reason = null; view.toast = "편지함에 돌려놓았어요."; }
      render();
    });

    const fill = (el, opts, cur) => {
      el.innerHTML = Object.entries(opts).map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join("");
    };
    fill(role, ROLES, view.role);
    fill(state, STATES, view.state);
    role.onchange = () => { view.role = role.value; view.tab = null; view.toast = ""; view.reading = null; render(); };
    state.onchange = () => { view.state = state.value; data = seed(view.state); view.open = null; view.reportFor = null; view.reading = null; view.toast = ""; render(); };
    render();
  </script>
</body>
</html>
