<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생일 서포트 프로토타입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { --bg: #0b0b10; --panel: #15151d; --line: #262633; --text: #f4f4f6; --sub: #9a9aab; --brand: #8956fb; --ok: #4fd1a5; --warn: #ffb44f; --bad: #ff7a7a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--text); letter-spacing: -0.01em; }
    button, textarea, input, select { font: inherit; color: inherit; }
    #view { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: #1b1b24; font-size: 13px; border-bottom: 1px dashed #444; }
    #view select, #view button { background: #0b0b10; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
    #app { max-width: 480px; margin: 0 auto; min-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--panel); }
    @media (min-width: 1024px) { #app { max-width: 720px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3a3a4a; flex: none; }
    .name { font-weight: 700; }
    .sub { color: var(--sub); font-size: 13px; line-height: 1.5; }
    .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card.hl { border-color: var(--brand); }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #2d2d3a; color: var(--sub); }
    .tag.brand { background: rgba(137, 86, 251, 0.18); color: #c9b3ff; }
    .tag.ok { background: rgba(79, 209, 165, 0.15); color: var(--ok); }
    .tag.warn { background: rgba(255, 180, 79, 0.15); color: var(--warn); }
    .tag.bad { background: rgba(255, 122, 122, 0.15); color: var(--bad); }
    .ph { background: #2a2a36; border-radius: 12px; aspect-ratio: 16 / 5; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; }
    .bar { height: 10px; border-radius: 999px; background: #23232e; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--brand); }
    .big { font-size: 22px; font-weight: 800; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .btn { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--brand); font-weight: 700; cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.ghost { background: #23232e; font-weight: 500; }
    .btn.danger { background: #3a1f24; color: var(--bad); }
    .btn.block { width: 100%; }
    .btn.sm { min-height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; }
    .choice { text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #0f0f15; cursor: pointer; min-height: 44px; flex: 1 1 180px; }
    .choice[aria-pressed="true"] { border-color: var(--brand); background: #1d1730; }
    input[type="number"], textarea, .field select { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #0f0f15; }
    textarea { resize: vertical; min-height: 88px; }
    label.check { display: flex; gap: 8px; align-items: center; min-height: 44px; }
    .err { color: var(--bad); font-size: 13px; min-height: 18px; }
    .receipt { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; }
    .receipt .minus { color: var(--bad); font-weight: 700; }
    .receipt .total { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 800; }
    .backers { display: flex; flex-wrap: wrap; gap: 6px; }
    .notice { padding: 10px 12px; border-radius: 12px; background: #1f1f2a; font-size: 13px; color: var(--sub); line-height: 1.5; }
    .empty { color: var(--sub); text-align: center; padding: 40px 16px; line-height: 1.6; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <!-- 보기 전환 — SPEC.md 권한 표·상태 변화 표를 눈으로 대조하는 장치. 프로토타입 화면의 일부가 아니다. -->
  <div id="view">
    <a href="../" style="color:#c9b3ff">← 목록</a>
    <a href="../spec.html?slug=birthday-support" style="color:#c9b3ff">명세 읽기</a>
    <label>역할 <select id="role"></select></label>
    <label>상태 <select id="state"></select></label>
    <button id="tick" type="button">⏩ 마감 시각 넘기기</button>
  </div>

  <div id="app"></div>

  <script>
    // 숫자는 여기 한 곳 — SPEC.md 「숫자」 절과 같은 값.
    const NUM = {
      // 목표 금액은 개설자가 정하지 않는다. 운영자가 정한 상품 가격이 곧 목표다.
      products: {
        banner: { name: "채널 배너 7일", price: 300000 },
        billboard: { name: "디지털 전광판 1일", price: 2000000 },
      },
      minContribution: 100,
      perUserCapRate: 0.3, // 1인 누적 상한 = 목표 × 30%
      fundingDays: [3, 7, 10, 14],
      prepDays: 7, // 마감 → 생일 사이 집행 준비 기간
      organizerMinDays: 30,
      approvalWaitDays: 3,
      introMax: 300,
    };
    const ROLES = { guest: "비로그인", fan: "일반 회원(후원자)", organizer: "개설자", owner: "방송인", admin: "운영자" };
    const STATES = { apply: "개설 신청", pending: "승인 대기", funding: "모금 중", reached: "목표 달성", failed: "미달 종료·환불", done: "집행 완료" };

    // 가짜 데이터 — 실데이터 금지.
    const OWNER = "달빛하루";
    const ORG = "별사탕";
    const FAN = "고양이발";
    const BIRTHDAY = "10월 24일";
    const RAISED = { pending: 0, funding: 292000, reached: 300000, failed: 142000, done: 300000 };
    const MINE = { funding: 0, reached: 5000, failed: 2000, done: 5000 };
    const BACKERS = [
      { nick: "새벽두시", anon: false }, { nick: "", anon: true }, { nick: "푸른고래", anon: false },
      { nick: "구름빵", anon: false }, { nick: "", anon: true }, { nick: "오렌지숲", anon: false },
    ];

    const seed = (s) => ({
      balance: 12000,
      draft: { product: "banner", days: 7, intro: "" },
      amount: "",
      anon: false,
      confirm: null,
      flash: "",
      stopRequested: false,
      project: s === "apply" ? null : {
        product: "banner",
        deadline: "10월 17일 23:59",
        daysLeft: 6,
        intro: "하루님 생일 축하 배너를 채널에 걸어요! 다 같이 축하해요 🎂",
        raised: RAISED[s],
        mine: MINE[s] ?? 0,
        backers: s === "pending" ? [] : [...BACKERS, ...(MINE[s] ? [{ nick: FAN, anon: false, me: true }] : [])],
        endReason: s === "failed" ? "목표 미달" : "",
      },
    });

    const view = { role: "fan", state: "funding" };
    let data = seed(view.state);
    const app = document.getElementById("app");

    const P = (n) => `${n.toLocaleString("ko-KR")}P`;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const product = () => NUM.products[data.project.product];
    const goal = () => product().price;
    const canBack = () => view.role === "fan" || view.role === "organizer";
    const myCap = () => Math.floor(goal() * NUM.perUserCapRate) - data.project.mine;
    const maxNow = () => Math.max(0, Math.min(myCap(), goal() - data.project.raised, data.balance));

    // 후원 금액 검사 — 어긋나면 이유 한 줄, 맞으면 빈 문자열.
    const check = (amt) => {
      if (!Number.isInteger(amt) || amt <= 0) return "후원할 포인트를 입력해 주세요.";
      if (amt < NUM.minContribution) return `${P(NUM.minContribution)}부터 후원할 수 있어요.`;
      if (amt > data.balance) return `보유 포인트(${P(data.balance)})보다 많아요.`;
      if (amt > goal() - data.project.raised) return `목표까지 ${P(goal() - data.project.raised)} 남았어요. 그 이상은 받지 않아요.`;
      if (amt > myCap()) return `한 사람은 목표의 ${NUM.perUserCapRate * 100}%(${P(Math.floor(goal() * NUM.perUserCapRate))})까지 후원할 수 있어요.`;
      return "";
    };

    const go = (s) => { view.state = s; document.getElementById("state").value = s; };

    const header = () => `
      <header>
        <div class="avatar"></div>
        <div><div class="name">${OWNER} <span class="tag brand">생일 서포트</span></div><div class="sub">생일 ${BIRTHDAY} · 채널 홈</div></div>
      </header>`;

    const statusTag = () => ({
      pending: `<span class="tag warn">방송인 승인 대기</span>`,
      funding: `<span class="tag brand">모금 중 · ${data.project.daysLeft}일 남음</span>`,
      reached: `<span class="tag ok">목표 달성 · 집행 준비 중</span>`,
      failed: `<span class="tag bad">${esc(data.project.endReason)} · 전액 환불</span>`,
      done: `<span class="tag ok">집행 완료</span>`,
    })[view.state];

    const progress = () => {
      const p = data.project;
      const pct = Math.min(100, Math.floor((p.raised / goal()) * 100));
      return `<div class="card ${view.state === "funding" ? "hl" : ""}">
        <div class="between"><span class="name">${product().name}</span>${statusTag()}</div>
        <div class="ph">${view.state === "done" ? "집행 증빙 사진 (운영자 업로드)" : "배너 시안 자리"}</div>
        <div class="sub">개설 ${ORG} · ${esc(p.intro)}</div>
        <div class="between"><span class="big" id="raised">${P(p.raised)}</span><span class="sub">목표 ${P(goal())} · ${pct}%</span></div>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <div class="sub">마감 ${p.deadline} · 생일 ${BIRTHDAY}에 게시 · 후원자 ${p.backers.length}명</div>
      </div>`;
    };

    const backerList = () => {
      const list = data.project.backers;
      if (view.state === "pending") return "";
      return `<div class="card">
        <div class="name">함께한 사람 ${list.length}명</div>
        <div class="backers">${list.length === 0 ? `<span class="sub">첫 후원자가 되어 주세요.</span>` :
          list.map((b) => `<span class="tag ${b.me ? "brand" : ""}">${b.anon ? "익명 후원자" : esc(b.nick)}${b.me ? " (나)" : ""}</span>`).join("")}</div>
        <div class="sub">후원 금액과 순위는 공개하지 않아요. 내가 낸 금액은 나만 볼 수 있어요.</div>
      </div>`;
    };

    const mineCard = () => {
      const p = data.project;
      if (!canBack() || p.mine === 0) return "";
      const line = {
        funding: `내 후원 ${P(p.mine)} · 목표에 닿지 못하면 마감 직후 전액 포인트로 돌려드려요.`,
        reached: `내 후원 ${P(p.mine)} · 목표가 채워져 생일에 게시돼요.`,
        failed: `내 후원 ${P(p.mine)} → 전액 환불 완료. 보유 포인트에 돌아왔어요.`,
        done: `내 후원 ${P(p.mine)} · 함께 만든 배너가 게시됐어요.`,
      }[view.state];
      return `<div class="notice" id="mine">${line}</div>`;
    };

    const contributeForm = () => {
      if (data.confirm) {
        const amt = data.confirm;
        return `<div class="card hl" id="confirm">
          <div class="name">후원 전에 확인해 주세요</div>
          <div class="receipt">
            <span>보유 포인트</span><span>${P(data.balance)}</span>
            <span>이번 후원</span><span class="minus">− ${P(amt)}</span>
            <span class="total">후원 후 남는 포인트</span><span class="total">${P(data.balance - amt)}</span>
          </div>
          <div class="notice">
            · 지금 바로 차감돼요. 모금 중에는 철회할 수 없어요.<br>
            · ${p_deadline()}까지 목표에 닿지 못하면 전액 포인트로 돌려드려요.<br>
            · 포인트는 개설자에게 가지 않아요. 서비스가 직접 ${product().name}를 집행해요.<br>
            · ${data.anon ? "익명 후원자로 표시돼요." : "닉네임이 후원자 목록에 표시돼요(금액은 비공개)."}
          </div>
          <div class="row">
            <button class="btn" data-act="confirm">${P(amt)} 후원 확정</button>
            <button class="btn ghost" data-act="back">돌아가기</button>
          </div>
        </div>`;
      }
      const err = data.amount === "" ? "" : check(Number(data.amount));
      return `<div class="card">
        <div class="between"><span class="name">포인트로 후원하기</span><span class="sub">보유 ${P(data.balance)}</span></div>
        <input type="number" id="amount" inputmode="numeric" min="${NUM.minContribution}" step="100" placeholder="${P(NUM.minContribution)}부터" value="${esc(data.amount)}" aria-label="후원 포인트">
        <div class="row">
          <button class="btn ghost sm" data-add="1000">+1,000</button>
          <button class="btn ghost sm" data-add="5000">+5,000</button>
          <button class="btn ghost sm" data-fill>최대 ${P(maxNow())}</button>
        </div>
        <label class="check"><input type="checkbox" id="anon" ${data.anon ? "checked" : ""}> 익명으로 후원</label>
        <div class="err" id="amount-err">${err}</div>
        <button class="btn block" data-act="review" ${data.amount === "" || err ? "disabled" : ""}>다음 — 차감 포인트 확인</button>
      </div>`;
    };
    const p_deadline = () => data.project.deadline;

    const applyForm = () => {
      const d = data.draft;
      return `<div class="card hl">
        <div class="name">${OWNER}님 생일 서포트 열기</div>
        <div class="sub">목표 금액은 상품 가격으로 정해져요. 모은 포인트는 개설자에게 가지 않고, 서비스가 상품을 직접 집행해요.</div>
        <div class="row">${Object.entries(NUM.products).map(([k, v]) => `
          <button class="choice" aria-pressed="${d.product === k}" data-product="${k}"><div class="name">${v.name}</div><div class="sub">목표 ${P(v.price)}</div></button>`).join("")}
        </div>
        <div class="field"><label class="sub" for="days">모금 기간</label>
          <select id="days">${NUM.fundingDays.map((n) => `<option value="${n}"${n === d.days ? " selected" : ""}>${n}일</option>`).join("")}</select>
        </div>
        <div class="sub">생일 ${BIRTHDAY} · 집행 준비 ${NUM.prepDays}일이 필요해서 늦어도 생일 ${NUM.prepDays}일 전에 마감돼요.</div>
        <div class="field"><label class="sub" for="intro">소개 (${NUM.introMax}자까지)</label>
          <textarea id="intro" maxlength="${NUM.introMax}" placeholder="어떤 축하를 하고 싶은지 적어 주세요">${esc(d.intro)}</textarea>
        </div>
        <div class="notice">${OWNER}님이 승인해야 모금이 시작돼요. ${NUM.approvalWaitDays}일 안에 답이 없으면 자동으로 닫혀요. 채널마다 한 번에 하나만 열 수 있어요.</div>
        <button class="btn block" data-act="apply" ${d.intro.trim() ? "" : "disabled"}>승인 요청 보내기</button>
      </div>`;
    };

    const empty = (msg) => `<div class="empty">${msg}</div>`;

    // ─── 역할 × 상태 화면 ───
    const SCREENS = {
      guest: () => ({
        apply: () => empty("진행 중인 생일 서포트가 없어요."),
        pending: () => empty("진행 중인 생일 서포트가 없어요."),
      })[view.state]?.() ?? `${progress()}${backerList()}${view.state === "funding" ? `<button class="btn block">로그인하고 후원하기</button>` : ""}`,

      fan: () => ({
        apply: () => empty(`진행 중인 생일 서포트가 없어요.<br>가입 ${NUM.organizerMinDays}일이 지난 회원은 직접 열 수 있어요.<br><button class="btn ghost" data-role-go="organizer">서포트 열기</button>`),
        pending: () => empty("진행 중인 생일 서포트가 없어요."),
      })[view.state]?.() ?? `${progress()}${mineCard()}${view.state === "funding" ? contributeForm() : ""}${backerList()}`,

      organizer: () => ({
        apply: () => applyForm(),
        pending: () => `${progress()}<div class="notice">${OWNER}님 승인을 기다리고 있어요. ${NUM.approvalWaitDays}일 안에 답이 없으면 자동으로 닫혀요.</div>
          <button class="btn ghost block" data-act="withdraw">신청 취소</button>`,
        funding: () => `${progress()}${mineCard()}${contributeForm()}${backerList()}
          ${data.project.backers.length === 0
            ? `<button class="btn danger block" data-act="withdraw">개설 취소</button>`
            : data.stopRequested
              ? `<div class="notice">중단 요청을 보냈어요. 운영자가 확인하면 후원자 전원에게 환불돼요.</div>`
              : `<button class="btn danger block" data-act="stop-request">중단 요청 (후원자가 있어 운영자 확인 필요)</button>`}`,
      })[view.state]?.() ?? `${progress()}${mineCard()}${backerList()}`,

      owner: () => ({
        apply: () => empty(`아직 생일 서포트 신청이 없어요.<br>신청이 오면 알려 드리고, 승인해야 공개돼요.`),
        pending: () => `<div class="notice">${ORG}님이 생일 서포트를 열고 싶어 해요. 승인하면 채널 홈에 공개되고 모금이 시작돼요.</div>${progress()}
          <div class="row"><button class="btn" data-act="approve">승인</button><button class="btn ghost" data-act="reject">거절</button></div>`,
        funding: () => `${progress()}${backerList()}<button class="btn danger block" data-act="owner-stop">서포트 중단 — 후원자 전원 환불</button>`,
      })[view.state]?.() ?? `${progress()}${backerList()}`,

      admin: () => {
        const body = ({
          apply: () => empty("신청 없음."),
          pending: () => `${progress()}<div class="notice">방송인 승인 대기. 운영자는 승인하지 않는다(방송인 권한).</div>`,
          funding: () => `${progress()}${backerList()}
            ${data.stopRequested ? `<div class="notice">개설자 중단 요청이 들어와 있어요.</div>` : ""}
            <div class="field"><label class="sub" for="reason">강제 종료 사유 (필수 · 감사 기록)</label><textarea id="reason" placeholder="예: 소개문 규정 위반"></textarea></div>
            <button class="btn danger block" data-act="admin-stop">강제 종료 — 후원자 전원 환불</button>`,
          reached: () => `${progress()}<div class="notice">목표 달성. 상품을 생일 일정에 맞춰 집행하고 증빙을 올린다.</div>
            <button class="btn block" data-act="execute">집행 완료 처리 (증빙 업로드)</button>`,
        })[view.state]?.() ?? `${progress()}${backerList()}`;
        return `${body}
          <div class="card"><div class="name">상품·숫자 (배포 없이 조정)</div>
            <table><tr><th>상품</th><th>목표</th></tr>${Object.values(NUM.products).map((v) => `<tr><td>${v.name}</td><td>${P(v.price)}</td></tr>`).join("")}</table>
            <div class="sub">최소 후원 ${P(NUM.minContribution)} · 1인 상한 목표의 ${NUM.perUserCapRate * 100}% · 개설 자격 가입 ${NUM.organizerMinDays}일. 바꾼 값은 새로 여는 서포트부터 적용돼요.</div>
          </div>`;
      },
    };

    const render = () => {
      app.innerHTML = `${header()}<div class="body">${data.flash ? `<div class="notice" id="flash">${data.flash}</div>` : ""}${SCREENS[view.role]()}</div>`;
      data.flash = "";
    };

    // 마감·종료 — 미달이든 중단이든 후원자 전원에게 같은 방식으로 돌려준다.
    const refundAll = (reason) => {
      data.balance += data.project.mine;
      data.project.endReason = reason;
      data.confirm = null;
      go("failed");
      data.flash = `${reason}로 끝났어요. 후원한 포인트는 전액 돌려드렸어요.`;
    };

    app.addEventListener("input", (e) => {
      const t = e.target;
      if (t.id === "intro") {
        data.draft.intro = t.value;
        app.querySelector('[data-act="apply"]').disabled = !t.value.trim();
      }
      if (t.id === "amount") {
        data.amount = t.value;
        const err = t.value === "" ? "" : check(Number(t.value));
        app.querySelector("#amount-err").textContent = err;
        app.querySelector('[data-act="review"]').disabled = t.value === "" || Boolean(err);
      }
    });

    app.addEventListener("change", (e) => {
      if (e.target.id === "anon") data.anon = e.target.checked;
      if (e.target.id === "days") data.draft.days = Number(e.target.value);
    });

    app.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const d = b.dataset;
      if (d.product) data.draft.product = d.product;
      if (d.add) data.amount = String((Number(data.amount) || 0) + Number(d.add));
      if ("fill" in d) data.amount = String(maxNow());
      if (d.roleGo) { view.role = d.roleGo; document.getElementById("role").value = d.roleGo; }
      const act = d.act;
      if (act === "apply") {
        data.project = { product: data.draft.product, deadline: "10월 17일 23:59", daysLeft: data.draft.days, intro: data.draft.intro.trim(), raised: 0, mine: 0, backers: [], endReason: "" };
        go("pending");
        data.flash = `${OWNER}님에게 승인 요청을 보냈어요.`;
      }
      if (act === "withdraw") { data.project = null; go("apply"); data.flash = "서포트를 닫았어요."; }
      if (act === "approve") { go("funding"); data.flash = "승인했어요. 채널 홈에 공개되고 모금이 시작됐어요."; }
      if (act === "reject") { data.project = null; go("apply"); data.flash = "거절했어요. 개설자에게 알려 드렸어요."; }
      if (act === "stop-request") { data.stopRequested = true; data.flash = "운영자에게 중단 요청을 보냈어요."; }
      if (act === "owner-stop") refundAll("방송인 중단");
      if (act === "admin-stop") {
        const reason = document.getElementById("reason").value.trim();
        if (!reason) { data.flash = "강제 종료 사유를 적어 주세요."; render(); return; }
        refundAll("운영 종료");
      }
      if (act === "execute") { go("done"); data.flash = "집행 완료로 바꿨어요. 후원자 전원에게 알려 드렸어요."; }
      if (act === "review") {
        const amt = Number(data.amount);
        if (check(amt)) return;
        data.confirm = amt;
      }
      if (act === "back") data.confirm = null;
      if (act === "confirm") {
        const amt = data.confirm;
        const p = data.project;
        data.balance -= amt;
        p.raised += amt;
        p.mine += amt;
        if (!p.backers.some((x) => x.me)) p.backers.push({ nick: view.role === "organizer" ? ORG : FAN, anon: data.anon, me: true });
        data.confirm = null;
        data.amount = "";
        data.flash = `${P(amt)} 후원했어요. 남은 포인트 ${P(data.balance)}.`;
        if (p.raised >= goal()) { go("reached"); data.flash += " 목표를 채워서 모금이 마감됐어요!"; }
      }
      render();
    });

    const fill = (el, opts, cur) => {
      el.innerHTML = Object.entries(opts).map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join("");
    };
    fill(role, ROLES, view.role);
    fill(state, STATES, view.state);
    role.onchange = () => { view.role = role.value; data.confirm = null; render(); };
    state.onchange = () => { view.state = state.value; data = seed(view.state); render(); };
    // 시간 흐름 흉내 — 모금 중일 때만 의미가 있다. 목표를 채우면 그 순간 마감되므로 여기서는 미달 종료만 일어난다.
    tick.onclick = () => {
      if (view.state !== "funding") { data.flash = "모금 중일 때만 마감 시각을 넘길 수 있어요."; render(); return; }
      refundAll("목표 미달");
      render();
    };
    render();
  </script>
</body>
</html>
