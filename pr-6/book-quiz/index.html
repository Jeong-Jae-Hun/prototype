<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책 퀴즈</title>
  <!-- 순서가 중요하다: 테마(색 결정) → 토큰·컴포넌트 → 셸 -->
  <script src="../design-system/theme.js" data-brands="reader partner"></script>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <script src="../app-structure/shell.js" data-active="book-quiz" defer></script>
  <style>
    main { max-width: 720px; margin: 0 auto; padding: var(--ds-space-5) var(--ds-space-4); display: flex; flex-direction: column; gap: var(--ds-space-4); }
    [hidden] { display: none !important; }
    h1 { font-size: var(--ds-font-size-xl); margin: 0; overflow-wrap: anywhere; }
    h2 { font-size: var(--ds-font-size-lg); margin: 0; overflow-wrap: anywhere; }
    p { margin: 0; }
    .stack { display: flex; flex-direction: column; gap: var(--ds-space-3); }
    .head { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-3); flex-wrap: wrap; }
    .sub { color: var(--ds-color-sub); font-size: var(--ds-font-size-sm); }
    .big { font-size: var(--ds-font-size-xl); font-weight: 800; }
    .flash { padding: var(--ds-space-3); border-radius: var(--ds-radius-md); background: var(--ds-color-brand-soft); color: var(--ds-color-brand-text); font-weight: 600; }
    .err { color: var(--ds-color-danger); font-size: var(--ds-font-size-sm); }
    .choice { justify-content: flex-start; text-align: left; border-radius: var(--ds-radius-md); }
    .choice[aria-pressed="true"] { background: var(--ds-color-brand-soft); color: var(--ds-color-brand-text); box-shadow: inset 0 0 0 2px var(--ds-color-brand); }
    .actions { display: flex; gap: var(--ds-space-2); flex-wrap: wrap; }
    .actions > .ds-btn { flex: 1 1 140px; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: var(--ds-space-1) var(--ds-space-3); }
    .bar .ds-progress { grid-column: 1 / -1; }
    .qedit { display: flex; flex-direction: column; gap: var(--ds-space-2); padding: var(--ds-space-3); border: 1px solid var(--ds-color-line); border-radius: var(--ds-radius-md); }
    .copt { display: flex; align-items: center; gap: var(--ds-space-2); }
    .copt input[type="radio"] { width: 22px; height: 22px; flex: none; }
  </style>
</head>
<body>
  <!-- 보기 전환 — 명세의 권한 표·상태 변화 표를 눈으로 대조하는 장치. 제품 화면이 아니다. -->
  <div id="view">
    <a href="../">← 목록</a>
    <a href="../spec.html?slug=book-quiz">명세 읽기</a>
    <label>역할 <select id="role"></select></label>
    <label>상태 <select id="state"></select></label>
  </div>

  <main id="app" aria-live="polite"></main>

  <script>
    // 숫자는 여기 한 곳 — SPEC.md 「숫자」 절과 같은 값.
    const NUM = {
      questionsMin: 3, questionsMax: 5, // 퀴즈당 문항 수 (선택지는 4개 고정)
      rewardPoint: 100,                 // 만점자 1인 이벤트 포인트 (운영 조정)
      statsMinParticipants: 5,          // 서점에 문항별 정답률을 보여 주는 최소 참여 수
    };
    const ROLES = { reader: "독자", owner: "사장님" };
    const STATES = { open: "진행 중", closed: "마감" };
    // 브랜드에 맞는 역할로 시작한다 — 화면 비교가 기본 역할을 찍는다.
    const view = { role: document.documentElement.dataset.brand === "partner" ? "owner" : "reader", state: "open" };
    let db, ui;

    // ─── 시나리오 ───
    const QS = [
      { q: "『고양이가 읽는 시』에서 고양이의 이름은?", c: ["모과", "보리", "율무", "자두"], a: 1 },
      { q: "시집은 몇 부로 나뉘어 있나요?", c: ["2부", "3부", "4부", "5부"], a: 2 },
      { q: "「밤의 서점」에서 고양이가 잠드는 곳은?", c: ["계산대 위", "창턱", "그림책 칸", "난로 옆"], a: 2 },
    ];
    const setup = () => {
      const closed = view.state === "closed";
      db = { quizzes: [
        { id: "q1", store: "숲속책방", title: "10월의 책 퀴즈", end: closed ? "10월 6일" : "10월 20일", status: view.state, qs: QS,
          stats: closed ? { n: 128, correct: [118, 101, 90] } : { n: 37, correct: [33, 30, 28] }, mine: closed ? [1, 2, 0] : null },
        { id: "q2", store: "골목서점", title: "골목서점 알아맞히기", end: "10월 12일", status: "open", qs: QS, stats: { n: 3, correct: [3, 2, 3] }, mine: null },
      ] };
      ui = { route: "list", id: null, qi: 0, answers: [], flash: "", err: "", draft: { title: "", qs: [blank(), blank(), blank()] } };
    };
    const blank = () => ({ q: "", c: ["", "", "", ""], a: -1 });
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const quiz = (id) => db.quizzes.find((x) => x.id === id);
    const score = (q) => q.mine.filter((a, i) => a === q.qs[i].a).length;

    // ─── 독자: 목록 → 풀기 → 결과 ───
    const readerList = () => `
      <div class="head"><h1>책 퀴즈</h1><span class="sub">만점자 ${NUM.rewardPoint}P</span></div>
      ${db.quizzes.map((q) => `
        <article class="ds-card stack">
          <div><span class="ds-tag ${q.status === "open" ? "ds-tag--success" : ""}">${q.status === "open" ? `진행 중 · ${q.end} 마감` : "마감 · 정답 공개"}</span>
            ${q.mine ? `<span class="ds-tag ds-tag--brand">제출함</span>` : ""}</div>
          <h2>${esc(q.title)}</h2>
          <p class="sub">${esc(q.store)} · ${q.qs.length}문항</p>
          <button class="ds-btn ${q.status === "open" && !q.mine ? "ds-btn--primary" : ""} ds-btn--block" data-act="${q.status === "open" && !q.mine ? "start" : "result"}" data-id="${q.id}">
            ${q.status === "open" && !q.mine ? "풀기" : "결과 보기"}</button>
        </article>`).join("")}`;

    const readerSolve = (q) => {
      const i = ui.qi; const x = q.qs[i]; const pick = ui.answers[i]; const last = i === q.qs.length - 1;
      return `
        <div class="head"><button class="ds-btn ds-btn--sm" data-act="back">← 목록</button><span class="sub">${i + 1} / ${q.qs.length}</span></div>
        <div class="ds-progress" aria-label="${q.qs.length}문항 중 ${i + 1}번째"><span style="width:${((i + 1) / q.qs.length) * 100}%"></span></div>
        <section class="ds-card stack">
          <h1>${esc(x.q)}</h1>
          ${x.c.map((t, k) => `<button class="ds-btn ds-btn--block choice" data-act="pick" data-k="${k}" aria-pressed="${pick === k}">${esc(t)}</button>`).join("")}
          <div class="actions">
            <button class="ds-btn" data-act="prev"${i === 0 ? " disabled" : ""}>이전</button>
            <button class="ds-btn ds-btn--primary" data-act="${last ? "submit" : "next"}"${pick === undefined ? " disabled" : ""}>${last ? "제출하기" : "다음"}</button>
          </div>
          ${last ? `<p class="sub">한 번만 제출할 수 있어요. 정답은 마감 뒤 공개돼요.</p>` : ""}
        </section>`;
    };

    const readerResult = (q) => {
      const head = `<button class="ds-btn ds-btn--sm" data-act="back">← 목록</button><h1>${esc(q.title)}</h1>`;
      if (q.status === "open") return `${head}
        <section class="ds-card stack"><p class="big">제출했어요</p><p>결과와 정답은 ${q.end} 마감 뒤 알림으로 알려 드려요.</p>
          <button class="ds-btn ds-btn--block" data-act="back">다른 퀴즈 보기</button></section>`;
      const s = q.mine ? score(q) : null;
      return `${head}
        <section class="ds-card stack">
          ${q.mine ? `<p class="big">${q.qs.length}문항 중 ${s}개 맞혔어요</p>
            <p>${s === q.qs.length ? `만점! ${NUM.rewardPoint}P(이벤트 포인트)를 드려요.` : "만점자만 포인트를 받아요. 다음 퀴즈에서 또 만나요."}</p>`
            : `<p>참여하지 않은 퀴즈예요. 정답은 누구나 볼 수 있어요.</p>`}
          ${q.qs.map((x, i) => `<p>${i + 1}. ${esc(x.q)}<br><b>정답 ${esc(x.c[x.a])}</b>${q.mine && q.mine[i] !== x.a ? ` <span class="sub">· 내 답 ${esc(x.c[q.mine[i]])}</span>` : ""}</p>`).join("")}
        </section>`;
    };

    // ─── 사장님: 퀴즈 만들기 + 요약 ───
    const ownerScreen = () => {
      const q = quiz("q1"); const d = ui.draft;
      const stats = q.stats.n < NUM.statsMinParticipants
        ? `<p class="sub">참여 ${NUM.statsMinParticipants}명부터 정답률을 보여 드려요.</p>`
        : q.qs.map((x, i) => { const pct = Math.round((q.stats.correct[i] / q.stats.n) * 100);
          return `<div class="bar"><span>${i + 1}. ${esc(x.q)}</span><b>${pct}%</b><div class="ds-progress" aria-label="정답률 ${pct}%"><span style="width:${pct}%"></span></div></div>`; }).join("");
      return `
        <section class="ds-card stack">
          <div class="head"><h2>${esc(q.title)}</h2><span class="ds-tag ${q.status === "open" ? "ds-tag--success" : ""}">${q.status === "open" ? `진행 중 · ${q.end} 마감` : "마감"}</span></div>
          <p>참여 <b>${q.stats.n}명</b></p>
          ${stats}
          <p class="sub">집계만 보여요. 누가 무엇을 골랐는지는 보이지 않아요.</p>
          ${q.status === "open" ? `<button class="ds-btn ds-btn--danger" data-act="close">지금 마감하기</button>` : ""}
        </section>
        <section class="ds-card stack">
          <h1>퀴즈 만들기</h1>
          <label class="ds-field">제목<input class="ds-input" data-field="title" value="${esc(d.title)}" placeholder="예: 11월의 책 퀴즈"></label>
          ${d.qs.map((x, i) => `
            <div class="qedit">
              <label class="ds-field">${i + 1}번 질문<input class="ds-input" data-field="q.${i}.q" value="${esc(x.q)}"></label>
              ${x.c.map((t, k) => `<div class="copt"><input type="radio" name="a${i}" aria-label="${k + 1}번이 정답" data-field="q.${i}.a" value="${k}"${x.a === k ? " checked" : ""}>
                <input class="ds-input" aria-label="선택지 ${k + 1}" data-field="q.${i}.c.${k}" value="${esc(t)}" placeholder="선택지 ${k + 1}"></div>`).join("")}
            </div>`).join("")}
          ${d.qs.length < NUM.questionsMax ? `<button class="ds-btn" data-act="add">문항 추가 (${d.qs.length}/${NUM.questionsMax})</button>` : ""}
          <p class="sub">동그라미가 정답이에요. 만점자에게 책숲이 ${NUM.rewardPoint}P를 드려요.</p>
          ${ui.err ? `<p class="err" role="alert">${ui.err}</p>` : ""}
          <button class="ds-btn ds-btn--primary ds-btn--block" data-act="publish">게시하기</button>
        </section>`;
    };

    const wrongSide = (toPartner) => `
      <section class="ds-card ds-empty">
        <h2>${toPartner ? "사장님 화면은 책숲 파트너에 있어요" : "퀴즈 풀기는 책숲 앱에 있어요"}</h2>
        <button class="ds-btn ds-btn--primary" data-act="brand" data-to="${toPartner ? "partner" : "reader"}">${toPartner ? "책숲 파트너로 보기" : "책숲으로 보기"}</button>
      </section>`;

    // ─── 그리기 ───
    const render = () => {
      const brand = document.documentElement.dataset.brand;
      const q = quiz(ui.id);
      const body = brand === "reader" && view.role === "owner" ? wrongSide(true)
        : brand === "partner" && view.role === "reader" ? wrongSide(false)
        : brand === "partner" ? ownerScreen()
        : ui.route === "solve" ? readerSolve(q) : ui.route === "result" ? readerResult(q) : readerList();
      app.innerHTML = (ui.flash ? `<p class="flash" role="status">${ui.flash}</p>` : "") + body;
    };
    const go = (route, extra = {}) => { Object.assign(ui, { route, flash: "", err: "" }, extra); render(); document.documentElement.scrollTop = 0; };

    // ─── 동작 — data-act 위임 ───
    const ACTS = {
      back: () => go("list", { id: null }),
      start: (el) => go("solve", { id: el.dataset.id, qi: 0, answers: [] }),
      result: (el) => go("result", { id: el.dataset.id }),
      pick: (el) => { ui.answers[ui.qi] = +el.dataset.k; render(); },
      prev: () => go("solve", { qi: ui.qi - 1 }),
      next: () => go("solve", { qi: ui.qi + 1 }),
      submit: () => {
        const q = quiz(ui.id);
        q.mine = [...ui.answers]; q.stats.n += 1;
        q.qs.forEach((x, i) => { if (q.mine[i] === x.a) q.stats.correct[i] += 1; });
        go("result");
      },
      brand: (el) => { const s = document.querySelector('select[data-ds="brand"]'); s.value = el.dataset.to; s.dispatchEvent(new Event("change", { bubbles: true })); },
      close: () => { quiz("q1").status = "closed"; ui.flash = "마감하고 정답을 공개했어요."; render(); },
      add: () => { ui.draft.qs.push(blank()); render(); },
      publish: () => {
        const d = ui.draft;
        const bad = d.qs.findIndex((x) => !x.q.trim() || x.c.some((t) => !t.trim()) || x.a < 0);
        ui.err = !d.title.trim() ? "제목을 넣어 주세요." : bad >= 0 ? `${bad + 1}번: 질문·선택지 4개·정답을 채워 주세요.` : "";
        if (!ui.err) { ui.flash = `「${esc(d.title.trim())}」를 게시했어요. 단골에게 알림이 가요.`; ui.draft = { title: "", qs: [blank(), blank(), blank()] }; }
        render();
      },
    };
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      if (el && !el.disabled) ACTS[el.dataset.act]?.(el);
    });
    app.addEventListener("input", (e) => {
      const f = e.target.dataset.field; if (!f) return;
      const [k, i, sub, j] = f.split(".");
      if (k === "title") ui.draft.title = e.target.value;
      else if (sub === "c") ui.draft.qs[+i].c[+j] = e.target.value;
      else if (sub === "a") ui.draft.qs[+i].a = +e.target.value;
      else ui.draft.qs[+i].q = e.target.value;
    });
    app.addEventListener("change", (e) => { const f = e.target.dataset.field; if (f?.endsWith(".a")) ui.draft.qs[+f.split(".")[1]].a = +e.target.value; });

    // ─── 보기 전환 ───
    const fill = (el, opts, cur) => { el.innerHTML = Object.entries(opts).map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join(""); };
    fill(role, ROLES, view.role);
    fill(state, STATES, view.state);
    const reset = () => { setup(); render(); };
    role.onchange = () => { view.role = role.value; reset(); };
    state.onchange = () => { view.state = state.value; reset(); };
    document.addEventListener("ds:change", render);
    reset();
  </script>
</body>
</html>
