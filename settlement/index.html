<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사장님 정산</title>
  <!-- 순서가 중요하다: 테마(색 결정) → 토큰·컴포넌트 → 셸 -->
  <script src="../design-system/theme.js" data-brands="partner"></script>
  <link rel="stylesheet" href="../design-system/tokens.css">
  <link rel="stylesheet" href="../design-system/components.css">
  <script src="../app-structure/shell.js" data-active="settlement" defer></script>
  <style>
    main { max-width: 960px; margin: 0 auto; padding: var(--ds-space-5) var(--ds-space-4); display: flex; flex-direction: column; gap: var(--ds-space-4); }
    [hidden] { display: none !important; }
    h1 { font-size: var(--ds-font-size-xl); margin: 0; }
    h2 { font-size: var(--ds-font-size-lg); margin: 0 0 var(--ds-space-3); }
    p { margin: 0; }
    .sub { color: var(--ds-color-sub); font-size: var(--ds-font-size-sm); }
    .stack { display: flex; flex-direction: column; gap: var(--ds-space-3); }
    .head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ds-space-2); }
    .big { font-size: 32px; font-weight: 800; letter-spacing: var(--ds-tracking-display); }
    .actions { display: flex; flex-wrap: wrap; gap: var(--ds-space-2); }
    .actions > .ds-btn { flex: 1 1 200px; }
    .lines { list-style: none; margin: 0; padding: 0; }
    .lines li { display: flex; justify-content: space-between; gap: var(--ds-space-3); padding: var(--ds-space-2) 0; border-bottom: 1px solid var(--ds-color-line); }
    .lines li:last-child { border-bottom: 0; }
    .lines .total { font-weight: 800; font-size: var(--ds-font-size-lg); }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
    .row { display: flex; align-items: center; gap: var(--ds-space-3); padding: var(--ds-space-3) 0; border-bottom: 1px solid var(--ds-color-line); min-height: var(--ds-tap); }
    .row:last-child { border-bottom: 0; }
    .row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .row__main strong { overflow-wrap: anywhere; }
    .row input[type="checkbox"] { width: 22px; height: 22px; flex: none; }
    .list-btn { display: flex; width: 100%; align-items: center; gap: var(--ds-space-3); padding: var(--ds-space-3) 0; min-height: var(--ds-tap); background: none; border: 0; border-bottom: 1px solid var(--ds-color-line); text-align: left; cursor: pointer; }
    .list-btn:last-child { border-bottom: 0; }
    .warn { color: var(--ds-color-warning); }
    .danger { color: var(--ds-color-danger); }
    .ok { color: var(--ds-color-success); }
    textarea.ds-input { min-height: 96px; resize: vertical; }
    select.ds-input { appearance: auto; }
    .grid2 { display: grid; gap: var(--ds-space-4); }
    @media (min-width: 900px) { .grid2 { grid-template-columns: 3fr 2fr; align-items: start; } }
  </style>
</head>
<body>
  <!-- 보기 전환 — 리뷰 도구. 제품 화면이 아니다. 브랜드·테마 칸은 theme.js 가 붙인다 -->
  <div id="view">
    <a href="../">← 목록</a>
    <a href="../spec.html?slug=settlement">명세 읽기</a>
    <label>역할 <select id="role"></select></label>
    <label>상태 <select id="state"></select></label>
  </div>

  <main id="app" aria-live="polite"></main>

  <script>
    // ─── 숫자 — SPEC.md 「숫자」 절과 같은 값 ───
    const NUM = {
      FEE_RATE_PCT: 10,            // 판매 수수료율. 어드민 › 정산 설정에서 읽는다(여기 값은 화면용 가짜). 그 달 1일 0시 값으로 고정
      PAY_DAY: 10,                 // 매월 지급일 (계약 고정)
      CONFIRM_DAY: 5,              // 매월 확정일 — 전월분 환불·취소 반영 마감
      DISPUTE_DAYS: 30,            // 이의 제기 기한 — 확정일로부터
      REVIEW_BUSINESS_DAYS: 5,     // 운영자 검토 목표(영업일)
      REASON_MIN: 10,              // 사유 최소 글자 수 (이의·보류·조정·기각 공통)
      ACCOUNT_LOCK_DAYS: 3,        // 지급일 n일 전부터 계좌 변경은 다음 지급부터 적용
      AUTH_CODE_LEN: 6,            // 본인 확인 코드 자리 수
    };
    // 가짜 "오늘" — 프로토타입 날짜 계산용
    const TODAY = new Date(2026, 9, 7);

    const ROLES = { owner: "사장님", staff: "직원", admin: "운영자" };
    const STATES = { aggregating: "집계 중", confirmed: "확정(지급 예정)", paid: "지급 완료", disputed: "이의 제기 중", held: "보류" };
    const STATUS_TAG = {
      aggregating: ["", "⏳ 집계 중"],
      confirmed: ["ds-tag--brand", "✓ 확정 · 지급 예정"],
      paid: ["ds-tag--success", "✓ 지급 완료"],
      disputed: ["ds-tag--brand", "! 이의 제기 중"],
      held: ["ds-tag--danger", "⏸ 보류"],
    };
    const KIND = { sale: "판매", refund: "환불", partial: "부분 환불", club: "모임 참가비(포인트)", adjust: "조정" };
    const DISPUTE_REASONS = { refund: "환불 금액이 실제와 달라요", missing: "빠진 주문이 있어요", fee: "수수료 계산이 이상해요", etc: "기타" };
    const HOLD_REASONS = { doc: "사업자 서류 확인 필요", account: "지급 계좌 확인 필요", abnormal: "이상 거래 점검", etc: "기타" };

    // ─── 가짜 데이터 — 독자 정보 없음. 주문 번호만 ───
    const STORE = "골목서점";
    const CUR = {
      id: "2026-09", label: "2026년 9월분", period: "9월 1일 ~ 9월 30일", month: 8, feeRate: NUM.FEE_RATE_PCT,
      rows: [
        { no: "CS-2609-0012", date: "9.02", kind: "sale", amount: 18000 },
        { no: "CS-2609-0031", date: "9.05", kind: "sale", amount: 15500 },
        { no: "CS-2609-0031", date: "9.06", kind: "refund", amount: -15500 },
        { no: "CS-2609-0048", date: "9.09", kind: "sale", amount: 32000 },
        { no: "MO-2609-003", date: "9.12", kind: "club", amount: 30000, note: "낭독회 · 6명" },
        { no: "CS-2609-0077", date: "9.14", kind: "sale", amount: 12800 },
        { no: "CS-2609-0077", date: "9.16", kind: "partial", amount: -6000 },
        { no: "CS-2609-0090", date: "9.18", kind: "sale", amount: 22000 },
        { no: "CS-2609-0103", date: "9.21", kind: "sale", amount: 16500 },
        { no: "MO-2609-007", date: "9.24", kind: "club", amount: 20000, note: "북클럽 · 4명" },
        { no: "CS-2609-0128", date: "9.27", kind: "sale", amount: 41000 },
        { no: "CS-2609-0142", date: "9.29", kind: "sale", amount: 13500 },
        { no: "D-0812", date: "9.12", kind: "adjust", amount: 4500, note: "8월분 이의 제기 조정" },
      ],
    };
    const PAST = [
      { id: "2026-08", label: "2026년 8월분", month: 7, feeRate: 10, paidOn: "9월 10일", dispute: "adjusted",
        rows: [
          { no: "CS-2608-0021", date: "8.03", kind: "sale", amount: 52000 },
          { no: "CS-2608-0066", date: "8.15", kind: "sale", amount: 98000 },
          { no: "CS-2608-0066", date: "8.18", kind: "partial", amount: -9000 },
          { no: "MO-2608-002", date: "8.22", kind: "club", amount: 25000, note: "북클럽 · 5명" },
        ] },
      { id: "2026-07", label: "2026년 7월분", month: 6, feeRate: 10, paidOn: "8월 10일",
        rows: [
          { no: "CS-2607-0009", date: "7.04", kind: "sale", amount: 74000 },
          { no: "CS-2607-0051", date: "7.19", kind: "sale", amount: 63500 },
        ] },
      { id: "2026-06", label: "2026년 6월분", month: 5, feeRate: 12, paidOn: "7월 10일",
        rows: [
          { no: "CS-2606-0014", date: "6.10", kind: "sale", amount: 88000 },
          { no: "CS-2606-0040", date: "6.28", kind: "refund", amount: -12000 },
        ] },
    ];

    // ─── 계산 — 금액은 원 정수. 수수료는 합계에 요율을 곱해 원 미만 버림 ───
    const calc = (s) => {
      const sum = (kinds) => s.rows.filter((r) => kinds.includes(r.kind)).reduce((a, r) => a + r.amount, 0);
      const sales = sum(["sale"]), refund = sum(["refund", "partial"]), club = sum(["club"]), adjust = sum(["adjust"]);
      const base = sales + refund + club;
      const fee = Math.floor((base * s.feeRate) / 100);
      return { sales, refund, club, base, fee, adjust, payout: base - fee + adjust };
    };
    const won = (n) => `${n < 0 ? "−" : ""}${Math.abs(n).toLocaleString("ko-KR")}원`;
    const signed = (n) => `${n > 0 ? "+" : ""}${won(n)}`;
    const md = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일`;
    const at = (m, d) => new Date(2026, m, d);
    const payDate = (s) => at(s.month + 1, NUM.PAY_DAY);
    const confirmDate = (s) => at(s.month + 1, NUM.CONFIRM_DAY);
    const deadline = (s) => { const d = confirmDate(s); d.setDate(d.getDate() + NUM.DISPUTE_DAYS); return d; };
    const nextPay = () => (TODAY < at(TODAY.getMonth(), NUM.PAY_DAY) ? at(TODAY.getMonth(), NUM.PAY_DAY) : at(TODAY.getMonth() + 1, NUM.PAY_DAY));
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    // ─── 메모리 상태 — 새로고침하면 처음으로 ───
    const view = { role: "owner", state: "confirmed" };
    let S;
    const reset = () => {
      const st = view.state;
      S = {
        status: st === "disputed" ? "confirmed" : st,   // aggregating | confirmed | paid | held
        holdFrom: "confirmed",
        hold: st === "held" ? { reason: HOLD_REASONS.doc, text: "사업자 등록증 사본 기한 만료 — 새 사본 확인 후 해제", on: "10월 6일" } : null,
        dispute: st === "disputed"
          ? { id: "D-0907", nos: ["CS-2609-0077"], reason: "refund", text: "부분 환불을 6,000원으로 했는데 매장에서는 4,000원만 돌려줬어요", status: "open", on: "10월 6일" }
          : null,
        account: { bank: "숲은행", tail: "1234", pending: null },
        audit: [{ at: "2026-09-12 11:20", who: "운영자 한결", what: "8월분 이의 D-0812 조정", before: "0원", after: "+4,500원", reason: "부분 환불이 두 번 차감됨 — 주문 CS-2608-0066" }],
        screen: "home", tab: "current", detailId: null,
        pick: new Set(), form: {}, errors: {}, flash: "", auth: { step: "start", code: "" }, staffHelp: false,
      };
    };
    const derived = () => (S.status === "held" ? "held" : S.dispute?.status === "open" ? "disputed" : S.status);
    const syncState = () => { view.state = derived(); stateSel.value = view.state; };
    const canDispute = () => ["confirmed", "paid", "held"].includes(S.status) && S.dispute?.status !== "open" && TODAY <= deadline(CUR);
    const audit = (what, before, after, reason) => {
      S.audit.unshift({ at: "2026-10-07 14:" + String(10 + S.audit.length).padStart(2, "0"), who: "운영자 한결", what, before, after, reason });
    };

    // ─── 그리기 조각 ───
    const tag = (st) => { const [cls, t] = STATUS_TAG[st]; return `<span class="ds-tag ${cls}">${t}</span>`; };
    const flash = () => (S.flash ? `<p class="ds-notice" role="status">${S.flash}</p>` : "");
    const errs = (k) => (S.errors[k] ? `<span class="ds-field__hint ds-field__hint--error">${S.errors[k]}</span>` : "");
    const breakdown = (s, estimate) => {
      const c = calc(s);
      return `<ul class="lines">
        <li><span>판매액</span><span class="num">${won(c.sales)}</span></li>
        <li><span>환불 <span class="sub">(부분 환불 포함)</span></span><span class="num">${won(c.refund)}</span></li>
        <li><span>모임 참가비 포인트 정산분 <span class="sub">(1P = 1원)</span></span><span class="num">${won(c.club)}</span></li>
        <li><span>판매 수수료 ${s.feeRate}% <span class="sub">(${s.month + 1}월 1일 기준 고정)</span></span><span class="num">${won(-c.fee)}</span></li>
        ${c.adjust ? `<li><span>지난 이의 조정 <span class="sub">(${s.rows.filter((r) => r.kind === "adjust").map((r) => r.no).join(", ")})</span></span><span class="num">${signed(c.adjust)}</span></li>` : ""}
        <li class="total"><span>${estimate ? "예상 지급액" : "지급액"}</span><span class="num">${won(c.payout)}</span></li>
      </ul>`;
    };
    const rowsHtml = (s, pickable) => s.rows.map((r) => {
      const isAdj = r.kind === "adjust";
      const key = `${r.no}|${r.kind}`;
      const box = pickable && !isAdj
        ? `<input type="checkbox" data-act="pick" data-key="${key}" aria-label="${r.no} ${KIND[r.kind]} 선택"${S.pick.has(key) ? " checked" : ""}>` : "";
      const t = isAdj ? "ds-tag--brand" : r.amount < 0 ? "ds-tag--danger" : "";
      return `<label class="row">${box}<span class="row__main"><strong>${r.no}</strong>
        <span class="sub">${r.date} · <span class="ds-tag ${t}">${KIND[r.kind]}</span>${r.note ? ` · ${r.note}` : ""}</span></span>
        <span class="num">${signed(r.amount)}</span></label>`;
    }).join("");

    const payLine = () => {
      const p = md(payDate(CUR));
      return {
        aggregating: `${md(confirmDate(CUR))} 확정 후 <strong>${p}</strong> 지급 예정. 환불·취소가 반영되면 금액이 바뀔 수 있어요.`,
        confirmed: `<strong>${p}</strong>에 숲은행 ****${S.account.tail} 계좌로 지급돼요.`,
        paid: `<strong>${p}</strong> 지급 완료 · 숲은행 ****${S.account.tail}`,
        held: `보류 중이라 <strong>${p}</strong>에 지급되지 않아요. 보류가 풀리면 그다음 지급일(매월 ${NUM.PAY_DAY}일)에 지급돼요.`,
      }[S.status];
    };

    const disputeCard = (forAdmin) => {
      const d = S.dispute;
      if (!d) return "";
      const rows = CUR.rows.filter((r) => d.nos.includes(r.no) && r.kind !== "adjust");
      const head = { open: tag("disputed"), adjusted: `<span class="ds-tag ds-tag--success">✓ 조정됨</span>`, rejected: `<span class="ds-tag">✕ 기각</span>` }[d.status];
      const result = d.status === "adjusted"
        ? `<p>조정 <strong>${signed(d.amount)}</strong> — 이번 정산은 그대로 두고 <strong>${md(at(CUR.month + 2, NUM.PAY_DAY))} 지급분(10월분)</strong>에 '조정' 행으로 들어가요.</p><p class="sub">운영자 사유: ${esc(d.decision)}</p>`
        : d.status === "rejected"
          ? `<p>기각됐어요. 사유: ${esc(d.decision)}</p><div class="actions"><a class="ds-btn" href="#" data-act="noop">고객센터에 문의하기</a></div>`
          : `<p class="sub">${d.on} 접수 · 운영자가 영업일 ${NUM.REVIEW_BUSINESS_DAYS}일 안에 검토해요. ${S.status === "held" ? "지급은 보류가 풀린 뒤에 나가요." : S.status === "paid" ? "인정된 금액은 다음 정산에 조정으로 들어가요." : `이의 제기와 상관없이 확정 금액은 ${md(payDate(CUR))}에 지급돼요.`}</p>`;
      return `<section class="ds-card stack">
        <div class="head"><h2 style="margin:0">이의 제기 ${d.id}</h2>${head}</div>
        <p>${DISPUTE_REASONS[d.reason]} — ${esc(d.text)}</p>
        <div>${rows.map((r) => `<div class="row"><span class="row__main"><strong>${r.no}</strong><span class="sub">${r.date} · ${KIND[r.kind]}</span></span><span class="num">${signed(r.amount)}</span></div>`).join("")}</div>
        ${result}
        ${forAdmin && d.status === "open" ? reviewForm() : ""}
      </section>`;
    };

    const holdCard = () => (S.hold && S.status === "held" ? `<section class="ds-card stack" role="alert">
        <div class="head"><h2 style="margin:0">정산이 보류됐어요</h2>${tag("held")}</div>
        <p><strong>사유</strong> · ${S.hold.reason}${S.hold.text ? ` — ${esc(S.hold.text)}` : ""}</p>
        <p class="sub">${S.hold.on} 보류. ${md(payDate(CUR))} 전에 풀리면 ${md(payDate(CUR))}에, 지나서 풀리면 그다음 달 ${NUM.PAY_DAY}일에 지급돼요. 금액은 바뀌지 않아요.</p>
        <div class="actions"><a class="ds-btn ds-btn--primary" href="#" data-act="noop">필요 서류 제출하기</a><a class="ds-btn" href="#" data-act="noop">고객센터에 문의하기</a></div>
      </section>` : "");

    // ─── 사장님 화면 ───
    const ownerHome = () => {
      const c = calc(CUR);
      const est = S.status === "aggregating";
      const current = `
        <div class="grid2">
          <div class="stack">
            ${holdCard()}
            <section class="ds-card stack">
              <div class="head"><span class="sub">${CUR.label} · ${CUR.period}</span>${tag(derived())}</div>
              <p class="sub">${est ? "이번 달 예상 정산" : "이번 정산 지급액"}</p>
              <p class="big num" style="text-align:left">${est ? "약 " : ""}${won(c.payout)}</p>
              <p>${payLine()}</p>
              ${breakdown(CUR, est)}
              <div class="actions">
                <button class="ds-btn ds-btn--primary" data-act="detail" data-id="${CUR.id}">주문 단위 내역 보기</button>
                ${canDispute() ? `<button class="ds-btn" data-act="dispute">이의 제기</button>` : ""}
              </div>
              ${est ? `<p class="ds-notice">이의 제기는 ${md(confirmDate(CUR))} 확정 후 ${md(deadline(CUR))}까지 할 수 있어요.</p>` : ""}
              ${!est && S.dispute?.status !== "open" ? `<p class="sub">이의 제기 기한: ${md(deadline(CUR))}까지 (확정일부터 ${NUM.DISPUTE_DAYS}일)</p>` : ""}
            </section>
            ${disputeCard(false)}
          </div>
          <section class="ds-card stack">
            <h2>지급 계좌</h2>
            <p>${S.account.bank} ****${S.account.tail} <span class="sub">· 예금주 ${STORE}(사업자 명의)</span></p>
            ${S.account.pending ? `<p class="ds-notice">변경 신청됨: ${S.account.pending.bank} ****${S.account.pending.tail} — ${S.account.pending.from} 지급부터 적용</p>` : ""}
            <button class="ds-btn" data-act="account">계좌 변경 (본인 확인 필요)</button>
            <p class="sub">수수료율은 운영 정책에 따라 바뀔 수 있어요. 바뀌면 다음 달 1일부터 적용되고, 진행 중인 달에는 적용되지 않아요.</p>
          </section>
        </div>`;
      const past = `<section class="ds-card">
          ${PAST.map((p) => `<button class="list-btn" data-act="detail" data-id="${p.id}">
            <span class="row__main"><strong>${p.label}</strong><span class="sub">${p.paidOn} 지급 · 수수료 ${p.feeRate}%${p.dispute ? " · 이의 제기 조정 있음" : ""}</span></span>
            <span class="num">${won(calc(p).payout)}</span>${tag("paid")}</button>`).join("")}
        </section>`;
      return `<h1>정산</h1>${flash()}
        <div class="ds-tabs" role="tablist">
          <button role="tab" data-act="tab" data-tab="current" aria-selected="${S.tab === "current"}">이번 정산</button>
          <button role="tab" data-act="tab" data-tab="past" aria-selected="${S.tab === "past"}">지난 정산</button>
        </div>
        ${S.tab === "current" ? current : past}`;
    };

    const detail = () => {
      const s = S.detailId === CUR.id ? CUR : PAST.find((p) => p.id === S.detailId);
      const isCur = s === CUR;
      const over = !isCur && TODAY > deadline(s);
      return `<div><button class="ds-btn" data-act="home">← 정산</button></div>
        <h1>${s.label} 내역</h1>
        <p class="ds-notice">독자 정보는 보이지 않아요. 주문은 주문 번호(CS-…), 모임은 모임 번호(MO-…)로만 확인해요. 조정 행은 원래 행을 고치지 않고 따로 더해져요.</p>
        <section class="ds-card">${breakdown(s, isCur && S.status === "aggregating")}</section>
        <section class="ds-card"><h2>주문 단위 (${s.rows.length}행)</h2>${rowsHtml(s, false)}</section>
        ${isCur && view.role === "owner" && canDispute() ? `<button class="ds-btn ds-btn--primary ds-btn--block" data-act="dispute">이 정산에 이의 제기</button>` : ""}
        ${over ? `<p class="ds-notice">이의 제기 기한(${md(deadline(s))})이 지났어요. 확인이 필요하면 <a href="#" data-act="noop">고객센터에 문의하기</a></p>` : ""}`;
    };

    const disputeForm = () => {
      const sel = CUR.rows.filter((r) => S.pick.has(`${r.no}|${r.kind}`));
      const total = sel.reduce((a, r) => a + r.amount, 0);
      return `<div><button class="ds-btn" data-act="home">← 정산</button></div>
        <h1>이의 제기 · ${CUR.label}</h1>
        <p class="ds-notice">이의 제기를 해도 확정 금액은 ${md(payDate(CUR))}에 그대로 지급돼요. 운영자가 인정한 금액은 다음 정산에 '조정' 행으로 더하거나 빼요. 기한 ${md(deadline(CUR))}까지.</p>
        <section class="ds-card stack">
          <h2>1. 대상 행 고르기</h2>
          ${errs("rows")}
          <div>${rowsHtml(CUR, true)}</div>
          <p class="sub">선택 ${sel.length}행 · 금액 합계 ${signed(total)}</p>
        </section>
        <section class="ds-card stack">
          <h2>2. 사유</h2>
          <label class="ds-field">사유 종류
            <select class="ds-input" data-f="reason"><option value="">고르세요</option>${Object.entries(DISPUTE_REASONS).map(([v, t]) => `<option value="${v}"${S.form.reason === v ? " selected" : ""}>${t}</option>`).join("")}</select>
            ${errs("reason")}</label>
          <label class="ds-field">자세한 내용 (${NUM.REASON_MIN}자 이상)
            <textarea class="ds-input" data-f="text" placeholder="예: 부분 환불을 6,000원으로 했는데 실제로는 4,000원만 돌려줬어요">${esc(S.form.text ?? "")}</textarea>
            ${errs("text")}</label>
        </section>
        <button class="ds-btn ds-btn--primary ds-btn--block" data-act="dispute-submit">이의 제기 보내기</button>`;
    };

    const accountFlow = () => {
      const a = S.auth;
      const lock = new Date(nextPay()); lock.setDate(lock.getDate() - NUM.ACCOUNT_LOCK_DAYS);
      const from = TODAY >= lock ? at(nextPay().getMonth() + 1, NUM.PAY_DAY) : nextPay();
      const body = {
        start: `<p>계좌를 바꾸려면 사장님 본인 확인이 필요해요. 가입한 휴대폰 010-****-5678 로 ${NUM.AUTH_CODE_LEN}자리 번호를 보내요.</p>
          <button class="ds-btn ds-btn--primary ds-btn--block" data-act="auth-send">인증번호 보내기</button>`,
        code: `<label class="ds-field">인증번호 ${NUM.AUTH_CODE_LEN}자리 <span class="ds-field__hint">프로토타입: 아무 숫자 ${NUM.AUTH_CODE_LEN}자리</span>
            <input class="ds-input" inputmode="numeric" maxlength="${NUM.AUTH_CODE_LEN}" data-f="code" value="${esc(S.form.code ?? "")}">${errs("code")}</label>
          <button class="ds-btn ds-btn--primary ds-btn--block" data-act="auth-check">확인</button>`,
        input: `<label class="ds-field">은행 <select class="ds-input" data-f="bank">${["나무은행", "숲은행", "골목저축은행"].map((b) => `<option${S.form.bank === b ? " selected" : ""}>${b}</option>`).join("")}</select></label>
          <label class="ds-field">계좌 번호 (숫자만)<input class="ds-input" inputmode="numeric" data-f="acct" value="${esc(S.form.acct ?? "")}">${errs("acct")}</label>
          <p class="sub">예금주는 사업자 등록 명의(${STORE})와 같아야 해요. 다르면 예금주 확인 단계에서 막혀요.</p>
          <button class="ds-btn ds-btn--primary ds-btn--block" data-act="acct-next">다음</button>`,
        confirm: `<ul class="lines">
            <li><span>지금 계좌</span><span>${S.account.bank} ****${S.account.tail}</span></li>
            <li><span>새 계좌</span><span>${esc(S.form.bank ?? "나무은행")} ****${esc((S.form.acct ?? "").slice(-4))}</span></li>
            <li class="total"><span>적용</span><span>${md(from)} 지급부터</span></li>
          </ul>
          <p class="ds-notice">지급일 ${NUM.ACCOUNT_LOCK_DAYS}일 전부터는 이미 이체가 준비돼 있어 ${md(nextPay())} 지급은 지금 계좌로 나가요. 변경 사실은 사장님 휴대폰으로도 알려요.</p>
          <button class="ds-btn ds-btn--primary ds-btn--block" data-act="acct-confirm" data-from="${md(from)}">계좌 변경 확정</button>`,
      }[a.step];
      return `<div><button class="ds-btn" data-act="home">← 정산</button></div>
        <h1>지급 계좌 변경</h1><section class="ds-card stack">${body}</section>`;
    };

    // ─── 직원 화면 — 권한 없음 + 다음 행동 ───
    const staffView = () => `<h1>정산</h1>
      <section class="ds-card ds-empty">
        <p style="font-size:32px" aria-hidden="true">🔒</p>
        <strong>정산은 사장님만 볼 수 있어요</strong>
        <p>매출·수수료·지급 계좌가 들어 있어 직원 계정에는 열리지 않아요.</p>
        <div class="actions" style="width:100%;max-width:420px">
          <a class="ds-btn ds-btn--primary" href="../">대시보드로 가기</a>
          <button class="ds-btn" data-act="staff-help">금액 확인이 필요하면</button>
        </div>
        ${S.staffHelp ? `<p class="ds-notice">사장님에게 직접 확인을 요청하세요. 주문 한 건의 환불·결제 상태는 '주문 관리'에서 볼 수 있어요. 직원에게 정산을 열어 주는 설정은 없어요.</p>` : ""}
      </section>`;

    // ─── 운영자 화면 (어드민 › 정산) ───
    const reviewForm = () => `<div class="stack">
        <label class="ds-field">조정 금액 (원, 정수 · 빼려면 −) <input class="ds-input" inputmode="numeric" data-f="adj" value="${esc(S.form.adj ?? "")}" placeholder="예: 2000">${errs("adj")}</label>
        <label class="ds-field">판단 사유 (${NUM.REASON_MIN}자 이상 · 사장님에게 보여요)<textarea class="ds-input" data-f="decision">${esc(S.form.decision ?? "")}</textarea>${errs("decision")}</label>
        <p class="sub">조정은 이번 정산을 고치지 않고 다음 정산(10월분)에 '조정' 행으로 들어가요. 감사 기록: 다음 정산 조정 0원 → 입력 금액.</p>
        <div class="actions"><button class="ds-btn ds-btn--primary" data-act="adjust">조정 확정</button><button class="ds-btn ds-btn--danger" data-act="reject">기각</button></div>
      </div>`;

    const adminHome = () => {
      const c = calc(CUR);
      const canHold = ["aggregating", "confirmed"].includes(S.status);
      let holdBox = "";
      if (S.screen === "hold" || S.screen === "release") {
        const isHold = S.screen === "hold";
        const relPay = TODAY < payDate(CUR) ? payDate(CUR) : at(CUR.month + 2, NUM.PAY_DAY);
        holdBox = `<section class="ds-card stack">
          <h2>${isHold ? "정산 보류" : "보류 해제"}</h2>
          ${isHold ? `<label class="ds-field">사유 종류<select class="ds-input" data-f="holdReason"><option value="">고르세요</option>${Object.entries(HOLD_REASONS).map(([v, t]) => `<option value="${v}"${S.form.holdReason === v ? " selected" : ""}>${t}</option>`).join("")}</select>${errs("holdReason")}</label>` : ""}
          <label class="ds-field">${isHold ? "사장님에게 보여 줄 설명" : "해제 사유"} (${NUM.REASON_MIN}자 이상)<textarea class="ds-input" data-f="holdText">${esc(S.form.holdText ?? "")}</textarea>${errs("holdText")}</label>
          <p class="ds-notice">${isHold
            ? `${STORE} ${CUR.label} <strong>${won(c.payout)}</strong>의 ${md(payDate(CUR))} 지급이 멈춰요. 사장님에게 사유가 알림으로 가요.`
            : `해제하면 <strong>${won(c.payout)}</strong>이 ${md(relPay)}에 지급돼요 (지급일 전 해제 → 이번 지급일, 지난 뒤 → 다음 달 ${NUM.PAY_DAY}일).`}</p>
          <div class="actions"><button class="ds-btn ds-btn--primary" data-act="${isHold ? "hold-confirm" : "release-confirm"}">${isHold ? "보류 확정" : "해제 확정"}</button><button class="ds-btn" data-act="home">취소</button></div>
        </section>`;
      }
      return `<h1>어드민 › 정산</h1>${flash()}
        <div class="grid2">
          <div class="stack">
            <section class="ds-card stack">
              <div class="head"><strong>${STORE}</strong><span class="sub">${CUR.label}</span>${tag(derived())}</div>
              <p class="big num" style="text-align:left">${won(c.payout)}</p>
              <p>${payLine()}</p>
              ${breakdown(CUR, S.status === "aggregating")}
              <div class="actions">
                <button class="ds-btn" data-act="detail" data-id="${CUR.id}">주문 단위 내역</button>
                ${canHold ? `<button class="ds-btn ds-btn--danger" data-act="hold">정산 보류</button>` : ""}
                ${S.status === "held" ? `<button class="ds-btn ds-btn--primary" data-act="release">보류 해제</button>` : ""}
              </div>
              ${S.status === "paid" ? `<p class="sub">지급이 끝난 정산은 보류할 수 없어요. 바로잡을 금액은 다음 정산 조정으로 처리해요.</p>` : ""}
            </section>
            ${holdCard()}
            ${holdBox}
            ${disputeCard(true)}
          </div>
          <div class="stack">
            <section class="ds-card stack">
              <h2>판매 수수료율</h2>
              <p><strong>${NUM.FEE_RATE_PCT}%</strong> <span class="sub">· 어드민 › 정산 설정</span></p>
              <p class="sub">바꾸면 다음 달 1일 0시부터 적용돼요. 진행 중인 달·이미 확정된 정산에는 적용되지 않아요.</p>
            </section>
            <section class="ds-card stack">
              <h2>감사 기록</h2>
              ${S.audit.map((e) => `<div class="row"><span class="row__main"><strong>${esc(e.what)}</strong>
                <span class="sub">${e.at} · ${e.who}</span><span>${esc(e.before)} → ${esc(e.after)}</span><span class="sub">사유: ${esc(e.reason)}</span></span></div>`).join("")}
            </section>
          </div>
        </div>`;
    };

    const readerView = () => `<section class="ds-card ds-empty">
        <strong>정산은 책숲 파트너(사장님 앱) 화면이에요</strong>
        <p>독자 앱 책숲에는 정산 메뉴가 없어요.</p>
        <button class="ds-btn ds-btn--primary" data-act="to-partner">책숲 파트너로 보기</button>
      </section>`;

    // ─── 그리기 ───
    const app = document.getElementById("app");
    const render = () => {
      if (document.documentElement.dataset.brand !== "partner") { app.innerHTML = readerView(); return; }
      if (view.role === "staff") { app.innerHTML = staffView(); return; }
      if (S.screen === "detail") { app.innerHTML = detail(); return; }
      if (view.role === "admin") { app.innerHTML = adminHome(); return; }
      app.innerHTML = { home: ownerHome, dispute: disputeForm, account: accountFlow }[S.screen]();
    };
    const go = (screen, extra = {}) => { Object.assign(S, { screen, errors: {}, ...extra }); render(); };
    const need = (k, ok, msg) => { if (!ok) S.errors[k] = msg; };
    const textOk = (v) => (v ?? "").trim().length >= NUM.REASON_MIN;

    // ─── 동작 — data-act 위임 ───
    const ACT = {
      noop: () => {},
      tab: (el) => { S.tab = el.dataset.tab; S.flash = ""; render(); },
      home: () => go("home", { form: {} }),
      detail: (el) => go("detail", { detailId: el.dataset.id }),
      dispute: () => go("dispute", { pick: new Set(), form: {}, flash: "" }),
      pick: (el) => { const k = el.dataset.key; S.pick.has(k) ? S.pick.delete(k) : S.pick.add(k); render(); },
      "dispute-submit": () => {
        S.errors = {};
        need("rows", S.pick.size > 0, "대상 행을 하나 이상 골라 주세요.");
        need("reason", !!S.form.reason, "사유 종류를 골라 주세요.");
        need("text", textOk(S.form.text), `자세한 내용을 ${NUM.REASON_MIN}자 이상 적어 주세요.`);
        if (Object.keys(S.errors).length) { render(); return; }
        S.dispute = { id: "D-0907", nos: [...S.pick].map((k) => k.split("|")[0]), reason: S.form.reason, text: S.form.text.trim(), status: "open", on: md(TODAY) };
        syncState();
        go("home", { tab: "current", flash: `이의 제기 ${S.dispute.id}가 접수됐어요. 운영자가 영업일 ${NUM.REVIEW_BUSINESS_DAYS}일 안에 검토하고 결과를 알림으로 보내요.` });
      },
      account: () => go("account", { auth: { step: "start" }, form: {}, flash: "" }),
      "auth-send": () => { S.auth.step = "code"; render(); },
      "auth-check": () => {
        S.errors = {};
        need("code", new RegExp(`^\\d{${NUM.AUTH_CODE_LEN}}$`).test(S.form.code ?? ""), `숫자 ${NUM.AUTH_CODE_LEN}자리를 넣어 주세요. 번호가 안 왔으면 다시 보내기를 누르세요.`);
        if (!Object.keys(S.errors).length) S.auth.step = "input";
        render();
      },
      "acct-next": () => {
        S.errors = {};
        S.form.bank ??= "나무은행";
        need("acct", /^\d{10,14}$/.test(S.form.acct ?? ""), "계좌 번호는 숫자 10~14자리예요.");
        if (!Object.keys(S.errors).length) S.auth.step = "confirm";
        render();
      },
      "acct-confirm": (el) => {
        S.account.pending = { bank: S.form.bank, tail: S.form.acct.slice(-4), from: el.dataset.from };
        go("home", { flash: `계좌 변경을 신청했어요. ${el.dataset.from} 지급부터 새 계좌로 보내요.`, form: {} });
      },
      "staff-help": () => { S.staffHelp = !S.staffHelp; render(); },
      hold: () => go("hold", { form: {}, flash: "" }),
      release: () => go("release", { form: {}, flash: "" }),
      "hold-confirm": () => {
        S.errors = {};
        need("holdReason", !!S.form.holdReason, "사유 종류를 골라 주세요.");
        need("holdText", textOk(S.form.holdText), `설명을 ${NUM.REASON_MIN}자 이상 적어 주세요.`);
        if (Object.keys(S.errors).length) { render(); return; }
        audit(`${STORE} ${CUR.label} 정산 보류`, STATES[S.status], "보류", `${HOLD_REASONS[S.form.holdReason]} — ${S.form.holdText.trim()}`);
        S.holdFrom = S.status;
        S.status = "held";
        S.hold = { reason: HOLD_REASONS[S.form.holdReason], text: S.form.holdText.trim(), on: md(TODAY) };
        syncState();
        go("home", { form: {}, flash: "보류했어요. 감사 기록에 남았고 사장님에게 알림이 갔어요." });
      },
      "release-confirm": () => {
        S.errors = {};
        need("holdText", textOk(S.form.holdText), `해제 사유를 ${NUM.REASON_MIN}자 이상 적어 주세요.`);
        if (Object.keys(S.errors).length) { render(); return; }
        const back = S.holdFrom === "held" ? "confirmed" : S.holdFrom;
        audit(`${STORE} ${CUR.label} 보류 해제`, "보류", STATES[back], S.form.holdText.trim());
        S.status = back;
        S.hold = null;
        syncState();
        go("home", { form: {}, flash: "보류를 해제했어요. 감사 기록에 남았어요." });
      },
      adjust: () => {
        S.errors = {};
        const raw = (S.form.adj ?? "").replace(/,/g, "").replace("−", "-").trim();
        need("adj", /^-?\d+$/.test(raw) && Number(raw) !== 0, "0이 아닌 정수(원)로 넣어 주세요.");
        need("decision", textOk(S.form.decision), `판단 사유를 ${NUM.REASON_MIN}자 이상 적어 주세요.`);
        if (Object.keys(S.errors).length) { render(); return; }
        const amount = Number(raw);
        audit(`${CUR.label} 이의 ${S.dispute.id} 조정 (10월분에 반영)`, "0원", signed(amount), S.form.decision.trim());
        Object.assign(S.dispute, { status: "adjusted", amount, decision: S.form.decision.trim() });
        syncState();
        go("home", { form: {}, flash: "조정을 확정했어요. 사장님에게 결과가 알림으로 가요." });
      },
      reject: () => {
        S.errors = {};
        need("decision", textOk(S.form.decision), `기각 사유를 ${NUM.REASON_MIN}자 이상 적어 주세요.`);
        if (Object.keys(S.errors).length) { render(); return; }
        audit(`${CUR.label} 이의 ${S.dispute.id} 기각`, "검토 대기", "기각", S.form.decision.trim());
        Object.assign(S.dispute, { status: "rejected", decision: S.form.decision.trim() });
        syncState();
        go("home", { form: {}, flash: "기각했어요. 사장님에게 사유가 알림으로 가요." });
      },
      "to-partner": () => {
        const sel = document.querySelector('select[data-ds="brand"]');
        if (sel) { sel.value = "partner"; sel.dispatchEvent(new Event("change", { bubbles: true })); }
        else { document.documentElement.dataset.brand = "partner"; render(); }
      },
    };
    app.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      if (!el) return;
      if (el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();
      if (el.type === "checkbox") return; // change 에서 처리
      if (el.tagName === "INPUT") return;
      e.preventDefault();
      ACT[el.dataset.act]?.(el);
    });
    app.addEventListener("change", (e) => {
      if (e.target.dataset.act === "pick") ACT.pick(e.target);
      else if (e.target.dataset.f) S.form[e.target.dataset.f] = e.target.value;
    });
    app.addEventListener("input", (e) => { if (e.target.dataset.f) S.form[e.target.dataset.f] = e.target.value; });

    // ─── 보기 전환 ───
    const roleSel = document.getElementById("role");
    const stateSel = document.getElementById("state");
    const fill = (el, opts, cur) => {
      el.innerHTML = Object.entries(opts).map(([v, t]) => `<option value="${v}"${v === cur ? " selected" : ""}>${t}</option>`).join("");
    };
    fill(roleSel, ROLES, view.role);
    fill(stateSel, STATES, view.state);
    roleSel.onchange = () => { view.role = roleSel.value; S.screen = "home"; S.errors = {}; S.flash = ""; render(); };
    stateSel.onchange = () => { view.state = stateSel.value; reset(); render(); };
    document.addEventListener("ds:change", render);
    reset();
    render();
  </script>
</body>
</html>
